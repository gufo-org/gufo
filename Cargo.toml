# The Rust components. Each one is a crate with a small C ABI; the gufo-rust
# crate in src/core/rust links them into the single static library that C++
# links, so the standard library and shared crates are built once.
[workspace]
resolver = "3"
members = ["src/core/ffi", "src/core/rust", "src/core/audio_decode", "src/core/base64", "src/core/cache_manifest", "src/core/chat_request", "src/core/chat_response", "src/core/generation_parse", "src/core/gguf", "src/core/http", "src/core/http_server", "src/core/jpeg_decode", "src/core/json", "src/core/json_schema", "src/core/metrics", "src/core/png", "src/core/realtime_voice", "src/core/resample", "src/core/safetensors", "src/core/tokenizer_json", "src/core/wav_decode", "src/core/websocket"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT"

[profile.release]
debug = 1

# CMake RelWithDebInfo, the shipped configuration.
[profile.relwithdebinfo]
inherits = "release"
debug = 2

# Optimized test builds (BUILD_TESTING=ON), which keep C++ assertions on too.
[profile.checked]
inherits = "relwithdebinfo"
debug-assertions = true
overflow-checks = true
