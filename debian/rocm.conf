# ROCm runtime libraries. The AMD ROCm runtime packages (hipblas,
# hipblaslt, rocblas, hip-runtime-amd) do not register this directory
# with the dynamic linker, so gufo cannot load libhipblas/librocblas/
# libamdhip64 without it. /opt/rocm is the stable symlink to the
# active ROCm installation.
/opt/rocm/lib
