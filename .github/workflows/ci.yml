name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: CPU contracts & repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate functional suite selection and reporting (CPU only)
        run: |
          python3 -m unittest discover -s tests/functional -p test_impact.py
          python3 -m unittest discover -s tests/functional -p test_report.py
          python3 -m unittest discover -s tests/functional -p test_devlab.py

      - name: Compute CMake compiler cache key
        id: ccache-key
        shell: bash
        run: echo "epoch-week=$(( $(date -u +%s) / 604800 ))" >> "$GITHUB_OUTPUT"

      - name: Restore CMake compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/gufo-ccache
          key: gufo-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}-${{ steps.ccache-key.outputs.epoch-week }}
          restore-keys: |
            gufo-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}-

      - name: Prepare CMake compiler cache
        shell: bash
        run: |
          mkdir -p /tmp/gufo-ccache
          chmod -R a+rwX /tmp/gufo-ccache
          chmod 1777 /tmp/gufo-ccache

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          determinate: false
          extra-conf: |
            extra-sandbox-paths = /tmp/gufo-ccache

      # Pull on every run; push only from main so pull requests do not fill
      # the cache. Fork pull requests receive no token and only pull.
      - name: Enable Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: gufo
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.event_name == 'pull_request' }}
          pushFilter: '(-source$|\.tar\.gz$)'

      - name: Enable Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          use-flakehub: false
          use-gha-cache: true

      - name: Run hosted PR checks
        run: |
          nix build .#checks.x86_64-linux.pr --print-build-logs --cores 2 --max-jobs 2
          cat ./result/pr-summary.txt

  windows-build:
    name: Windows platform tests (cross-build)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute CMake compiler cache key
        id: ccache-key
        shell: bash
        run: echo "epoch-week=$(( $(date -u +%s) / 604800 ))" >> "$GITHUB_OUTPUT"

      - name: Restore CMake compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/gufo-ccache
          key: gufo-windows-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}-${{ steps.ccache-key.outputs.epoch-week }}
          restore-keys: |
            gufo-windows-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}-

      - name: Prepare CMake compiler cache
        shell: bash
        run: |
          mkdir -p /tmp/gufo-ccache
          chmod -R a+rwX /tmp/gufo-ccache
          chmod 1777 /tmp/gufo-ccache

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          determinate: false
          extra-conf: |
            extra-sandbox-paths = /tmp/gufo-ccache

      # The derivation's source holds only the platform leaves, the CPU cache
      # and their tests, so a pull request that changes neither substitutes
      # the binaries instead of rebuilding them.
      - name: Enable Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: gufo
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.event_name == 'pull_request' }}
          pushFilter: '(-source$|\.tar\.gz$)'

      - name: Enable Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          use-flakehub: false
          use-gha-cache: true

      - name: Cross-build the Windows test binaries
        run: |
          nix build .#windows-platform-tests --print-build-logs --cores 2 --max-jobs 2
          mkdir windows-tests
          cp result/bin/*_test.exe windows-tests/

      - name: Upload the Windows test binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-platform-tests
          path: windows-tests/
          retention-days: 3
          if-no-files-found: error

  windows-test:
    name: Windows platform tests
    needs: windows-build
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      # Static MinGW binaries: the host needs no toolchain or checkout.
      - name: Download the Windows test binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-platform-tests
          path: windows-tests

      - name: Run the Windows test binaries
        shell: pwsh
        run: |
          $tests = @(Get-ChildItem windows-tests -Filter *_test.exe | Sort-Object Name)
          if ($tests.Count -eq 0) {
            Write-Host "::error::No Windows test binaries were downloaded."
            exit 1
          }
          $failed = @()
          foreach ($test in $tests) {
            Write-Host "::group::$($test.Name)"
            & $test.FullName
            $code = $LASTEXITCODE
            Write-Host "::endgroup::"
            if ($code -ne 0) { $failed += "$($test.Name) (exit $code)" }
          }
          if ($failed.Count -gt 0) {
            Write-Host "::error::Failed: $($failed -join ', ')"
            exit 1
          }
          Write-Host "Passed $($tests.Count) Windows test binaries."

  cache-package:
    name: Push nix build to Cachix
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A new revision is a new derivation, so Nix rebuilds gufo in full; the
      # compiler cache keeps that rebuild to the changed sources. Each run
      # saves a fresh entry and restores the newest one for the same lock.
      - name: Restore package compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/gufo-ccache
          key: gufo-package-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            gufo-package-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}-

      - name: Prepare package compiler cache
        run: |
          mkdir -p /tmp/gufo-ccache
          chmod -R a+rwX /tmp/gufo-ccache
          chmod 1777 /tmp/gufo-ccache

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          determinate: false
          extra-conf: |
            extra-sandbox-paths = /tmp/gufo-ccache

      # Pushes what this job builds and cache.nixos.org lacks: the patched
      # ROCr runtime and the gufo package.
      - name: Enable Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: gufo
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          pushFilter: '(-source$|\.tar\.gz$)'

      - name: Build production package
        run: nix build .#default --print-build-logs --cores 4 --max-jobs 1
