name: Linux build

on:
  workflow_call:
    inputs:
      revision:
        required: true
        type: string
      baseline:
        default: ''
        type: string
      artifact-name:
        required: true
        type: string
      # Also build the gpu-test configuration of the candidate (assertions
      # on), in a parallel job; Devlab runs correctness against it.
      checked:
        default: false
        type: boolean
      # Comma-separated CTest labels whose test executables the checked
      # package bundles (tools/ci/ctest_bundle.py).
      ctest-labels:
        default: ''
        type: string
    secrets:
      CACHIX_AUTH_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  build:
    # The release leg keeps its historical job name; devlab_artifact.py
    # watches both names for failures.
    name: ${{ matrix.variant == 'checked' && 'Linux checked package' || 'Linux package' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      # A failed leg must not cancel the other: Devlab reports each separately.
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.checked && '["release", "checked"]' || '["release"]') }}
    env:
      # Release builds share one compiler cache. The checked build also
      # restores it: its production libraries keep NDEBUG and hit it.
      CCACHE_PREFIX: ${{ matrix.variant == 'checked' && 'gufo-checked-ccache-v1' || 'gufo-package-ccache-v1' }}
      # Outside a pull request, caches land in the calling ref's scope. A
      # dispatched Devlab run builds a PR's merge commit from main, so only a
      # build of the ref's own revision saves there.
      OWN_REVISION: ${{ inputs.revision == github.sha }}
    steps:
      - name: Check out candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false

      - name: Run artifact contract tests
        run: |
          python3 -m unittest discover -s tests/tools -p npu_artifacts_test.py
          python3 -m unittest discover -s tests/tools -p linux_artifact_test.py
          python3 -m unittest discover -s tests/tools -p devlab_artifact_test.py
          python3 -m unittest discover -s tests/tools -p ctest_bundle_test.py

      - name: Check out baseline source
        if: inputs.baseline != '' && matrix.variant == 'release'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.baseline }}
          path: baseline-source
          persist-credentials: false

      # A unique save key retains each build, failed ones included, so a rerun
      # keeps their objects; restore the newest compiler cache for this pinned
      # toolchain, including main's warm cache.
      - name: Restore compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/gufo-ccache
          key: ${{ env.CCACHE_PREFIX }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.CCACHE_PREFIX }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}-
            gufo-package-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}-

      - name: Prepare compiler cache
        run: |
          mkdir -p /tmp/gufo-ccache
          chmod -R a+rwX /tmp/gufo-ccache
          chmod 1777 /tmp/gufo-ccache

      # A pull request saves its compiler cache only when the build added at
      # least 32 MiB to it; otherwise it keeps no duplicate of main's cache.
      - name: Snapshot restored compiler cache
        continue-on-error: true
        if: github.event_name == 'pull_request'
        run: python3 tools/ci/cache_growth.py snapshot /tmp/gufo-ccache "$RUNNER_TEMP/cache-growth.json"

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          determinate: false
          extra-conf: |
            extra-substituters = https://gufo.cachix.org
            extra-trusted-public-keys = gufo.cachix.org-1:rfZe3n4lHINgyoACKzs5EthIZmBNvEyCCtufUpth0PE=
            extra-sandbox-paths = /tmp/gufo-ccache

      - name: Enable Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: gufo
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.event_name == 'pull_request' }}
          pushFilter: '(-source$|\.tar\.gz$)'

      # Each NPU design has its own derivation (.devops/nix/npu-designs.nix).
      # Restore the combined closure before either package build. A prefix
      # match supplies unchanged designs when another design has changed;
      # PRs cannot push them to Cachix.
      - name: Identify the NPU designs
        id: npu
        run: |
          set -euo pipefail
          drv=$(nix eval --raw .#default --apply 'p: if p.npuDesigns or null == null then "" else p.npuDesigns.drvPath')
          out=$(nix eval --raw .#default --apply 'p: if p.npuDesigns or null == null then "" else p.npuDesigns.outPath')
          echo "drv=$drv" >> "$GITHUB_OUTPUT"
          echo "out=$out" >> "$GITHUB_OUTPUT"
          echo "key=gufo-npu-designs-v2-$(basename "${drv:-none}" .drv)" >> "$GITHUB_OUTPUT"

      - name: Restore NPU designs
        id: npu-cache
        if: steps.npu.outputs.drv != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/gufo-npu-designs
          key: ${{ steps.npu.outputs.key }}
          restore-keys: |
            gufo-npu-designs-v2-

      - name: Import NPU designs
        if: steps.npu-cache.outputs.cache-matched-key != ''
        run: |
          # Copy the recorded closure root, not --all: file binary caches
          # enumerate hash-only placeholder names that are not store paths.
          while IFS= read -r root; do
            if ! nix copy --no-check-sigs --from file:///tmp/gufo-npu-designs "$root"; then
              echo "::warning::NPU cache import failed; missing designs will be rebuilt"
            fi
          done < /tmp/gufo-npu-designs/roots.txt

      # Step limits stay below the job's 120 minutes so the cache saves below
      # still run after a slow or cold build.
      # Build independent designs concurrently, before the memory-heavy Gufo
      # compile. Each design's Ninja pool bounds program compilation to two.
      - name: Build NPU designs
        if: steps.npu.outputs.drv != ''
        timeout-minutes: 30
        env:
          NPU_DRV: ${{ steps.npu.outputs.drv }}
        run: nix build --no-link "$NPU_DRV^*" --print-build-logs --cores 2 --max-jobs 4

      - name: Build and package baseline
        if: inputs.baseline != '' && matrix.variant == 'release'
        timeout-minutes: 40
        env:
          EXPECTED_REVISION: ${{ inputs.baseline }}
        run: |
          set -euo pipefail
          # Both arms use the candidate's pinned compiler and dependencies.
          nix build --impure --file tools/ci/linux-baseline.nix \
            --argstr source "$GITHUB_WORKSPACE/baseline-source" \
            --argstr revision "$EXPECTED_REVISION" \
            --out-link result-baseline --print-build-logs --cores 4 --max-jobs 1
          python3 tools/ci/linux_artifact.py pack --package result-baseline \
            --revision "$EXPECTED_REVISION" --output linux-artifacts/baseline

      - name: Build and package candidate
        if: matrix.variant == 'release'
        timeout-minutes: 40
        env:
          EXPECTED_REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          nix build .#default --print-build-logs --cores 4 --max-jobs 1
          python3 tools/ci/linux_artifact.py pack --package result \
            --revision "$EXPECTED_REVISION" --output linux-artifacts/candidate

      # The same NPU designs and dependencies; BUILD_TESTING=ON keeps the
      # assertions that production compiles out (.devops/nix/package.nix).
      - name: Build and package the checked candidate
        if: matrix.variant == 'checked'
        timeout-minutes: 40
        env:
          EXPECTED_REVISION: ${{ inputs.revision }}
          CTEST_LABELS: ${{ inputs.ctest-labels }}
        run: |
          set -euo pipefail
          # .#checked plus the selected labels' GPU test executables.
          nix build --impure --file tools/ci/linux-checked.nix --argstr labels "$CTEST_LABELS" \
            --out-link result-checked --print-build-logs --cores 4 --max-jobs 1
          python3 tools/ci/linux_artifact.py pack --package result-checked \
            --revision "$EXPECTED_REVISION" --output linux-artifacts/checked

      # After the candidate build, even a failed one: the designs build first.
      # The release leg alone saves them, under one key, and only on a miss:
      # a pull request saves them only when it changed a design.
      - name: Export NPU designs
        id: npu-export
        if: >-
          always() && matrix.variant == 'release' && steps.npu.outputs.drv != '' &&
          steps.npu-cache.outputs.cache-hit != 'true' &&
          (github.event_name == 'pull_request' || env.OWN_REVISION == 'true')
        env:
          NPU_OUT: ${{ steps.npu.outputs.out }}
        run: |
          set -euo pipefail
          if nix path-info "$NPU_OUT" >/dev/null 2>&1; then
            nix copy --to file:///tmp/gufo-npu-designs "$NPU_OUT"
            printf '%s\n' "$NPU_OUT" > /tmp/gufo-npu-designs/roots.txt
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save NPU designs
        if: always() && steps.npu-export.outputs.ready == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/gufo-npu-designs
          key: ${{ steps.npu.outputs.key }}

      # An empty result, such as from a failed measurement, saves.
      - name: Measure compiler cache growth
        continue-on-error: true
        id: growth
        if: always() && github.event_name == 'pull_request'
        run: python3 tools/ci/cache_growth.py check /tmp/gufo-ccache "$RUNNER_TEMP/cache-growth.json" >> "$GITHUB_OUTPUT"

      - name: Save compiler cache
        if: >-
          always() &&
          (github.event_name == 'pull_request' && steps.growth.outputs.save != 'false' ||
          github.event_name != 'pull_request' && env.OWN_REVISION == 'true')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/gufo-ccache
          key: ${{ env.CCACHE_PREFIX }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify and archive the portable bundle
        if: matrix.variant == 'release'
        env:
          EXPECTED_REVISION: ${{ inputs.revision }}
          EXPECTED_BASELINE: ${{ inputs.baseline }}
          RUNTIME_ARTIFACT: ${{ inputs.artifact-name }}-runtime
        run: |
          set -euo pipefail
          python3 tools/ci/linux_artifact.py verify --source linux-artifacts/candidate --revision "$EXPECTED_REVISION"
          if [[ -n "$EXPECTED_BASELINE" ]]; then
            python3 tools/ci/linux_artifact.py verify --source linux-artifacts/baseline --revision "$EXPECTED_BASELINE"
          fi
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            -I 'gzip -1 -n' -cf linux-runtime.tar.gz -C linux-artifacts runtime
          python3 - <<'PYRUNTIME'
          import hashlib, json, os
          from pathlib import Path
          archive = Path('linux-runtime.tar.gz')
          with archive.open('rb') as source:
              digest = hashlib.file_digest(source, 'sha256').hexdigest()
          Path('linux-artifacts/runtime.json').write_text(json.dumps({
              'artifact': os.environ['RUNTIME_ARTIFACT'], 'digest': 'sha256:' + digest}) + '\n')
          PYRUNTIME
          tar --exclude=linux-artifacts/runtime -I 'gzip -1' -cf linux-artifacts.tar.gz linux-artifacts
          du -h linux-artifacts.tar.gz linux-runtime.tar.gz

      # The checked bundle's libraries resolve from the shared runtime that
      # the release leg uploads (same pinned closure); verify runs against
      # that runtime on Devlab.
      - name: Verify and archive the checked bundle
        if: matrix.variant == 'checked'
        env:
          EXPECTED_REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          python3 tools/ci/linux_artifact.py verify --source linux-artifacts/checked --revision "$EXPECTED_REVISION"
          tar -I 'gzip -1' -cf linux-checked.tar.gz linux-artifacts/checked
          du -h linux-checked.tar.gz

      - name: Upload checked candidate
        if: matrix.variant == 'checked'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.artifact-name }}-checked
          path: linux-checked.tar.gz
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

      - name: Upload shared Linux runtime
        if: matrix.variant == 'release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.artifact-name }}-runtime
          path: linux-runtime.tar.gz
          compression-level: 0
          retention-days: 3

      - name: Upload comparison packages
        if: matrix.variant == 'release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.artifact-name }}
          path: linux-artifacts.tar.gz
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
