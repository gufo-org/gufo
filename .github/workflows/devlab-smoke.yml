name: Devlab functional checks

on:
  pull_request_target:
    types: [ labeled ]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Maintainer-approved PR to test (head pinned at authorization)
        required: true
        type: string
      benchmark:
        description: Also run the native AR benchmark through 128K
        default: false
        type: boolean

permissions: {}

concurrency:
  group: devlab-smoke
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize functional checks
    if: >-
      github.repository == 'gufo-org/gufo' &&
      (github.event_name == 'workflow_dispatch' || github.event.label.name == 'ci:functional')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      head: ${{ steps.revision.outputs.head }}
      pr: ${{ steps.revision.outputs.pr }}
      has_work: ${{ steps.plan.outputs.has_work }}
      base: ${{ steps.plan.outputs.base }}
    permissions:
      contents: read
    steps:
      - name: Require a repository maintainer
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ACTOR: ${{ github.event.sender.login || github.actor }}
          RERUN_ACTOR: ${{ github.triggering_actor }}
        shell: bash
        run: |
          set -euo pipefail
          for actor in "$REQUEST_ACTOR" "$RERUN_ACTOR"; do
            role=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$actor/permission" --jq .role_name)
            case "$role" in
              admin|maintain) echo "Authorized $actor ($role)" ;;
              *) echo "::error::Functional checks require Maintain or Admin access."; exit 1 ;;
            esac
          done

      - name: Pin approved PR head
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
          LABEL_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "::error::Invalid PR number"; exit 1; }
          head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)
          if [[ -n "$LABEL_HEAD" && "$head" != "$LABEL_HEAD" ]]; then
            echo "::error::PR changed since the label was applied. Remove and reapply ci:functional."
            exit 1
          fi
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "pr=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted workflow and test harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Validate functional impact rules
        run: python3 -m unittest discover -s tests/functional -p test_impact.py

      - name: Select affected Flash-Next suites
        id: plan
        env:
          PR_NUMBER: ${{ steps.revision.outputs.pr }}
          APPROVED_HEAD: ${{ steps.revision.outputs.head }}
          RUN_BENCHMARK: ${{ inputs.benchmark || false }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch https://github.com/gufo-org/gufo.git "refs/pull/$PR_NUMBER/head:refs/ci/pr" main:refs/ci/main
          [[ "$(git rev-parse refs/ci/pr)" == "$APPROVED_HEAD" ]] || {
            echo "::error::PR changed after approval; start a new run."
            exit 1
          }
          base=$(git merge-base refs/ci/main "$APPROVED_HEAD")
          echo "base=$base" >> "$GITHUB_OUTPUT"
          python3 tests/functional/impact.py --repo . --base "$base" --head "$APPROVED_HEAD" \
            --model flash-next-q4 --output functional-plan.json
          python3 - <<'PYPLAN'
          import json, os
          plan = json.load(open('functional-plan.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              work = bool(plan['groups']) or os.environ['RUN_BENCHMARK'] == 'true'
              print('has_work=' + str(work).lower(), file=output)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Changed-file functional plan\n\n')
              summary.write(f"Revisions: `{plan['base']}` → `{plan['head']}`.\n\n")
              for path in plan['paths']:
                  summary.write(f"- `{path['path']}` → {', '.join(path['rules'])}\n")
              for group in plan['groups']:
                  summary.write(f"\n**{group['profile']} / {group['configuration']}**: " + ', '.join(group['suites']) + '\n')
              summary.write(f"\nDeferred: {len(plan['deferred'])}; outside Flash-Next scope: {len(plan['out_of_scope'])}.\n")
              summary.write('Candidate correctness only. Other-model, numerical, agent replay and timing qualification remain separate obligations.\n')
          PYPLAN

      - name: Retain selection plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: functional-plan-${{ github.run_attempt }}
          path: functional-plan.json

  smoke:
    name: Flash-Next functional checks on Strix Halo
    needs: authorize
    if: needs.authorize.outputs.has_work == 'true'
    runs-on: [ strix-halo, devlab-dispatch ]
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      # Run only the SHA pinned by the maintainer-authorized hosted job.
      - name: Verify platform and GPU device access
        shell: bash
        run: |
          set -euo pipefail
          printf '## Devlab Strix Halo smoke test\n\n' >> "$GITHUB_STEP_SUMMARY"
          uname -srm
          [[ "$(uname -s)" == Linux && "$(uname -m)" == x86_64 ]] || {
            echo "::error::Gufo requires Linux x86-64."
            exit 1
          }
          [[ -c /dev/kfd && -r /dev/kfd && -w /dev/kfd ]] || {
            echo "::error::The runner needs read/write access to /dev/kfd."
            exit 1
          }
          render_access=false
          for device in /dev/dri/renderD*; do
            if [[ -c "$device" && -r "$device" && -w "$device" ]]; then
              echo "Accessible render device: $device"
              render_access=true
            fi
          done
          [[ "$render_access" == true ]] || {
            echo "::error::No accessible DRM render device."
            exit 1
          }
          printf -- '- Linux x86-64: verified\n- KFD/render device access: verified\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Report power profile and exposed limits
        shell: bash
        run: |
          set -euo pipefail
          printf '\n### Power configuration\n\n```text\n' >> "$GITHUB_STEP_SUMMARY"
          report_file() {
            local path="$1" value
            if [[ -r "$path" ]] && value=$(cat "$path" 2>/dev/null); then
              printf '%s: %s\n' "$path" "$value" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          }
          report_file /sys/firmware/acpi/platform_profile
          report_file /sys/firmware/acpi/platform_profile_choices
          for path in /sys/class/platform-profile/*/profile \
                      /sys/class/platform-profile/*/choices \
                      /sys/devices/system/cpu/cpufreq/policy*/scaling_governor \
                      /sys/devices/system/cpu/cpufreq/policy*/energy_performance_preference; do
            report_file "$path"
          done
          for device in /sys/class/drm/card*/device; do
            [[ -r "$device/vendor" ]] || continue
            [[ "$(cat "$device/vendor")" == 0x1002 ]] || continue
            report_file "$device/power_dpm_force_performance_level"
            report_file "$device/pp_power_profile_mode"
            for hwmon in "$device"/hwmon/hwmon*; do
              report_file "$hwmon/name"
              for metric in power1_cap power1_cap_default power1_cap_min power1_cap_max; do
                path="$hwmon/$metric"
                if [[ -r "$path" ]] && value=$(cat "$path" 2>/dev/null); then
                  awk -v path="$path" -v value="$value" \
                    'BEGIN { printf "%s: %.3f W\n", path, value / 1000000 }' \
                    | tee -a "$GITHUB_STEP_SUMMARY"
                fi
              done
            done
          done
          printf '```\n\nUnavailable interfaces are omitted. These readings do not establish the firmware APU TDP when it is not exposed to the runner.\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Verify gfx1151 and inventory available tools
        shell: bash
        run: |
          set -euo pipefail
          rocminfo_bin=$(command -v rocminfo || true)
          if [[ -z "$rocminfo_bin" && -x /opt/rocm/bin/rocminfo ]]; then
            rocminfo_bin=/opt/rocm/bin/rocminfo
          fi
          if [[ -n "$rocminfo_bin" ]]; then
            "$rocminfo_bin" > "$RUNNER_TEMP/devlab-rocminfo.txt"
            cat "$RUNNER_TEMP/devlab-rocminfo.txt"
            grep -Eq 'Name:[[:space:]]+gfx1151([[:space:]]|$)' "$RUNNER_TEMP/devlab-rocminfo.txt" || {
              echo "::error::ROCm did not enumerate a gfx1151 agent."
              exit 1
            }
            verification='ROCm agent enumeration'
          else
            # KFD encodes gfx1151 as major 11, minor 5, stepping 1.
            verified=false
            for properties in /sys/class/kfd/kfd/topology/nodes/*/properties; do
              if [[ -r "$properties" ]]; then
                target=$(awk '$1 == "gfx_target_version" { print $2 }' "$properties")
                echo "KFD graphics target: $target"
                if [[ "$target" == 110501 ]]; then
                  verified=true
                fi
              fi
            done
            [[ "$verified" == true ]] || {
              echo "::error::Cannot verify gfx1151: install rocminfo or expose KFD topology."
              exit 1
            }
            verification='KFD topology; ROCm tools are not installed'
          fi
          printf -- '- gfx1151: verified (%s)\n' "$verification" >> "$GITHUB_STEP_SUMMARY"
          for tool in nix hipcc rocminfo rocm-smi amd-smi python3 git; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "$tool: available"
              printf -- '- %s: available\n' "$tool" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "$tool: not on PATH"
              printf -- '- %s: not on PATH\n' "$tool" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          awk '/^MemTotal:/ { printf "Host-visible memory: %.1f GiB\n", $2 / 1048576 }' /proc/meminfo
          printf '\nThis probe verifies runner placement and GPU device access. It does not execute a model or qualify performance.\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout trusted workflow and test harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: controller

      - name: Recreate approved selection plan and candidate checkout
        env:
          APPROVED_BASE: ${{ needs.authorize.outputs.base }}
          APPROVED_HEAD: ${{ needs.authorize.outputs.head }}
        shell: bash
        run: |
          set -euo pipefail
          git init candidate
          git -C candidate fetch https://github.com/gufo-org/gufo.git "$APPROVED_HEAD" "$APPROVED_BASE"
          git -C candidate checkout --detach "$APPROVED_HEAD"
          base="$APPROVED_BASE"
          python3 controller/tests/functional/impact.py --repo candidate --base "$base" --head "$APPROVED_HEAD" \
            --model flash-next-q4 --output functional-plan.json

      - name: Build Gufo from source
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          printf 'Approved candidate: %s\n' "$(git rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
          cmake --version
          c++ --version
          hipcc --version
          cmake --preset release -DCMAKE_INSTALL_PREFIX="$HOME/.local"
          cmake --build --preset release --parallel 4
          ./build/release/gufo diagnose

      - name: Prepare persistent model cache
        shell: bash
        run: |
          set -euo pipefail
          model_dir="$HOME/.cache/gufo/models/flash-next/38bb39ee97821de2c9009abb7e93950eec396e66"
          mkdir -p "$model_dir"
          printf 'GUFO_MODEL_DIR=%s\n' "$model_dir" >> "$GITHUB_ENV"

      - name: Download pinned Flash-Next Q4 weights
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/gufo-hf-cli"
          "$RUNNER_TEMP/gufo-hf-cli/bin/python" -m pip install 'huggingface_hub[hf_xet]'
          # The cluster mirror times out on HEAD requests for the large shards.
          export HF_ENDPOINT=https://huggingface.co
          export HF_HUB_DISABLE_XET=0
          export HF_XET_HIGH_PERFORMANCE=1
          export HF_HUB_DOWNLOAD_TIMEOUT=120
          export HF_HUB_ETAG_TIMEOUT=60
          printf 'Hugging Face endpoint: %s\n' "${HF_ENDPOINT:-https://huggingface.co}"
          printf 'Xet disabled by runner: %s\n' "${HF_HUB_DISABLE_XET:-0}"
          export HF_HOME="$HOME/.cache/gufo/huggingface"
          df -h "$GUFO_MODEL_DIR"
          downloaded=false
          for attempt in 1 2 3; do
            if "$RUNNER_TEMP/gufo-hf-cli/bin/hf" download unsloth/Qwen3.8-Flash-Next-GGUF \
              --revision 38bb39ee97821de2c9009abb7e93950eec396e66 \
              --include 'UD-Q4_K_XL/*.gguf' 'MTP/mtp-Qwen3.8-Flash-Next-shared-Q8_0.gguf' 'mmproj-BF16.gguf' \
              --local-dir "$GUFO_MODEL_DIR"; then
              downloaded=true
              break
            fi
            echo "::warning::Download attempt $attempt failed; retaining partial files for resume."
          done
          [[ "$downloaded" == true ]] || {
            echo "::error::Flash-Next download failed after three attempts."
            exit 1
          }

      - name: Install functional client dependencies
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/gufo-functional-client"
          "$RUNNER_TEMP/gufo-functional-client/bin/python" -m pip install openai httpx pillow

      - name: Run selected functional suites in AR and MTP
        shell: bash
        run: |
          "$RUNNER_TEMP/gufo-functional-client/bin/python" controller/tests/functional/cluster.py \
            --plan functional-plan.json --binary candidate/build/release/gufo \
            --weights "$GUFO_MODEL_DIR" --output functional-results

      - name: Benchmark Flash-Next AR through 128K depth
        if: inputs.benchmark
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          ./build/release/gufo bench \
            --model "$GUFO_MODEL_DIR/UD-Q4_K_XL/Qwen3.8-Flash-Next-UD-Q4_K_XL-00001-of-00004.gguf" \
            --speculative off --n-prompt 2048 --n-gen 128 \
            --n-depth 0,4096,8192,12288,16384,32768,65536,131072 \
            --repetitions 1 \
            2> >(tee "$RUNNER_TEMP/gufo-bench.stderr" >&2) \
            | tee "$RUNNER_TEMP/gufo-bench.md"
          cat "$RUNNER_TEMP/gufo-bench.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Retain functional reports and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flash-next-functional-${{ github.run_attempt }}
          path: |
            functional-plan.json
            functional-results/
          retention-days: 14

      - name: Remove temporary downloader environment
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/gufo-hf-cli" "$RUNNER_TEMP/gufo-functional-client"
