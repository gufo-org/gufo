name: Devlab functional checks

on:
  # Same trigger and fork approval policy as CI. The check is advisory: it is
  # not required for merging.
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR to test (head pinned at authorization)
        required: true
        type: string
      tier:
        description: pr trims suites and transports; full runs the complete set (release PRs)
        type: choice
        options: [ full, pr ]
        default: full
      ar:
        description: Also run the functional suites in AR (speculative off); selected draft modes always run
        default: false
        type: boolean
      benchmark:
        description: Also benchmark native AR through 128K on the PR merged into main and on main
        default: false
        type: boolean

permissions: {}

# A new push supersedes the PR's queued or running check.
concurrency:
  group: devlab-functional-${{ inputs.pr_number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  authorize:
    name: Authorize functional checks
    if: >-
      github.repository == 'gufo-org/gufo' &&
      (github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      head: ${{ steps.revision.outputs.head }}
      merge: ${{ steps.revision.outputs.merge }}
      pr: ${{ steps.revision.outputs.pr }}
      has_work: ${{ steps.plan.outputs.has_work }}
      base: ${{ steps.plan.outputs.base }}
      tier: ${{ steps.plan.outputs.tier }}
    permissions:
      contents: read
      statuses: write # fork PR tokens stay read-only
    steps:
      # Pull requests follow the repository's fork approval policy, like CI.
      # Dispatches require Maintain or Admin.
      - name: Authorize dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_ACTOR: ${{ github.actor }}
          RERUN_ACTOR: ${{ github.triggering_actor }}
        shell: bash
        run: |
          set -euo pipefail
          for actor in "$DISPATCH_ACTOR" "$RERUN_ACTOR"; do
            role=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$actor/permission" \
              --jq .role_name 2>/dev/null || true)
            case "$role" in
              admin|maintain) echo "Authorized $actor" ;;
              *) echo "::error::Dispatching functional checks requires Maintain or Admin access."; exit 1 ;;
            esac
          done

      - name: Pin PR head
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_MERGE: ${{ github.event_name == 'pull_request' && github.sha || '' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "::error::Invalid PR number"; exit 1; }
          # Test the revision that triggered the event; a later push starts its own run.
          head=${EVENT_HEAD:-$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)}
          # Like CI, test the PR merged into main: suites from main then always
          # run against a binary that contains the server changes they expect.
          merge=${EVENT_MERGE:-$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.merge_commit_sha // empty')}
          [[ -n "$merge" ]] || { echo "::error::PR does not merge cleanly into main; rebase it."; exit 1; }
          {
            echo "head=$head"
            echo "merge=$merge"
            echo "pr=$PR_NUMBER"
          } >> "$GITHUB_OUTPUT"

      # Advisory only: devlab/functional is not a required check, so cluster
      # problems never block merging.
      - name: Mark advisory status pending
        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.revision.outputs.head }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" -f state=pending \
            -f context=devlab/functional -f description="Planning functional checks" \
            -f target_url="$RUN_URL" --silent

      - name: Checkout workflow and test harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Validate functional impact rules and report rendering
        run: |
          python3 -m unittest discover -s tests/functional -p test_impact.py
          python3 -m unittest discover -s tests/functional -p test_report.py
          python3 -m unittest discover -s tests/functional -p test_devlab.py

      - name: Select affected model representatives and suites
        id: plan
        env:
          PR_NUMBER: ${{ steps.revision.outputs.pr }}
          APPROVED_HEAD: ${{ steps.revision.outputs.head }}
          APPROVED_MERGE: ${{ steps.revision.outputs.merge }}
          RUN_BENCHMARK: ${{ inputs.benchmark || false }}
          RUN_AR: ${{ inputs.ar || false }}
          DISPATCH_TIER: ${{ inputs.tier }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          # Release PRs run the complete set; other PRs the pr tier.
          tier="pr"
          [[ "$HEAD_REF" == release-please--* ]] && tier=full
          [[ -n "$DISPATCH_TIER" ]] && tier="$DISPATCH_TIER"
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
          modes=()
          [[ "$RUN_AR" == true ]] && modes+=(--ar)
          [[ "$RUN_BENCHMARK" == true ]] && modes+=(--benchmark)
          git fetch https://github.com/gufo-org/gufo.git "refs/pull/$PR_NUMBER/head:refs/ci/pr" "$APPROVED_MERGE"
          [[ "$(git rev-parse refs/ci/pr)" == "$APPROVED_HEAD" ]] || {
            echo "::error::PR changed after this run started; the new push starts its own run."
            exit 1
          }
          [[ "$(git rev-parse "$APPROVED_MERGE^2")" == "$APPROVED_HEAD" ]] || {
            echo "::error::Merge commit $APPROVED_MERGE does not merge the pinned PR head."
            exit 1
          }
          # The merge's main parent is both the timing baseline and the diff base.
          base=$(git rev-parse "$APPROVED_MERGE^1")
          echo "base=$base" >> "$GITHUB_OUTPUT"
          python3 tests/functional/devlab_plan.py --repo . --base "$base" --head "$APPROVED_MERGE" \
            "${modes[@]}" --tier "$tier" --output functional-plan.json
          python3 - <<'PYPLAN'
          import json, os
          plan = json.load(open('functional-plan.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              work = bool(plan['models'])
              print('has_work=' + str(work).lower(), file=output)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Changed-file functional plan\n\n')
              summary.write(f"Revisions: `{plan['base']}` → `{plan['head']}`; tier `{plan['tier']}`.\n\n")
              for path in plan['paths']:
                  summary.write(f"- `{path['path']}` → {', '.join(path['rules'])}\n")
              for model in plan['models']:
                  summary.write(f"\n**{model['id']}**: " + ', '.join(sorted({reason['rule'] for reason in model['reasons']})) + '\n')
              for group in plan['groups']:
                  summary.write(f"\n**{group['profile']} / {group['configuration']}**: " + ', '.join(group['suites']) + '\n')
              summary.write(f"\nDeferred: {len(plan['deferred'])}; release run only: {len(plan['release_only'])}; outside scope {', '.join(plan['scope'])}: {len(plan['out_of_scope'])}.\n")
              summary.write('Selected candidate correctness and paired server-phase timings against main. Other-model and agent replay obligations remain separate.\n')
          PYPLAN

      - name: Retain selection plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: functional-plan-${{ github.run_attempt }}
          path: functional-plan.json

  smoke:
    name: Selected model checks on Strix Halo
    needs: authorize
    if: needs.authorize.outputs.has_work == 'true'
    runs-on: [ linux, strix-halo, devlab-dispatch ]
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      # Self-hosted workspaces persist between runs; start from a clean tree.
      - name: Clean workspace and check disk space
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- candidate baseline functional-results functional-report functional-plan.json functional-assets.json phase-logs
          # An empty ephemeral runner downloads only the plan-selected pinned assets.
          cache_root="${GUFO_CI_CACHE:-$RUNNER_TOOL_CACHE/gufo}"
          mkdir -p "$cache_root"
          printf 'GUFO_CACHE_ROOT=%s\n' "$cache_root" >> "$GITHUB_ENV"
          df -h "$GITHUB_WORKSPACE" "$cache_root"
          fence='~~~'
          printf '### Disk before run\n\n%stext\n%s\n%s\n\n' "$fence" \
            "$(df -h "$GITHUB_WORKSPACE" "$cache_root")" "$fence" >> "$GITHUB_STEP_SUMMARY"

      # Run only the SHA pinned by the hosted authorize job.
      - name: Verify platform and GPU device access
        shell: bash
        run: |
          set -euo pipefail
          printf '## Devlab Strix Halo smoke test\n\n' >> "$GITHUB_STEP_SUMMARY"
          uname -srm
          [[ "$(uname -s)" == Linux && "$(uname -m)" == x86_64 ]] || {
            echo "::error::Gufo requires Linux x86-64."
            exit 1
          }
          [[ -c /dev/kfd && -r /dev/kfd && -w /dev/kfd ]] || {
            echo "::error::The runner needs read/write access to /dev/kfd."
            exit 1
          }
          render_access=false
          for device in /dev/dri/renderD*; do
            if [[ -c "$device" && -r "$device" && -w "$device" ]]; then
              echo "Accessible render device: $device"
              render_access=true
            fi
          done
          [[ "$render_access" == true ]] || {
            echo "::error::No accessible DRM render device."
            exit 1
          }
          printf -- '- Linux x86-64: verified\n- KFD/render device access: verified\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Report power profile and exposed limits
        shell: bash
        run: |
          set -euo pipefail
          printf '\n### Power configuration\n\n```text\n' >> "$GITHUB_STEP_SUMMARY"
          report_file() {
            local path="$1" value
            if [[ -r "$path" ]] && value=$(cat "$path" 2>/dev/null); then
              printf '%s: %s\n' "$path" "$value" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          }
          report_file /sys/firmware/acpi/platform_profile
          report_file /sys/firmware/acpi/platform_profile_choices
          for path in /sys/class/platform-profile/*/profile \
                      /sys/class/platform-profile/*/choices \
                      /sys/devices/system/cpu/cpufreq/policy*/scaling_governor \
                      /sys/devices/system/cpu/cpufreq/policy*/energy_performance_preference; do
            report_file "$path"
          done
          for device in /sys/class/drm/card*/device; do
            [[ -r "$device/vendor" ]] || continue
            [[ "$(cat "$device/vendor")" == 0x1002 ]] || continue
            report_file "$device/power_dpm_force_performance_level"
            report_file "$device/pp_power_profile_mode"
            for hwmon in "$device"/hwmon/hwmon*; do
              report_file "$hwmon/name"
              for metric in power1_cap power1_cap_default power1_cap_min power1_cap_max; do
                path="$hwmon/$metric"
                if [[ -r "$path" ]] && value=$(cat "$path" 2>/dev/null); then
                  awk -v path="$path" -v value="$value" \
                    'BEGIN { printf "%s: %.3f W\n", path, value / 1000000 }' \
                    | tee -a "$GITHUB_STEP_SUMMARY"
                fi
              done
            done
          done
          printf '```\n\nUnavailable interfaces are omitted. These readings do not establish the firmware APU TDP when it is not exposed to the runner.\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Verify gfx1151 and inventory available tools
        shell: bash
        run: |
          set -euo pipefail
          rocminfo_bin=$(command -v rocminfo || true)
          if [[ -z "$rocminfo_bin" && -x /opt/rocm/bin/rocminfo ]]; then
            rocminfo_bin=/opt/rocm/bin/rocminfo
          fi
          if [[ -n "$rocminfo_bin" ]]; then
            "$rocminfo_bin" > "$RUNNER_TEMP/devlab-rocminfo.txt"
            cat "$RUNNER_TEMP/devlab-rocminfo.txt"
            grep -Eq 'Name:[[:space:]]+gfx1151([[:space:]]|$)' "$RUNNER_TEMP/devlab-rocminfo.txt" || {
              echo "::error::ROCm did not enumerate a gfx1151 agent."
              exit 1
            }
            verification='ROCm agent enumeration'
          else
            # KFD encodes gfx1151 as major 11, minor 5, stepping 1.
            verified=false
            for properties in /sys/class/kfd/kfd/topology/nodes/*/properties; do
              if [[ -r "$properties" ]]; then
                target=$(awk '$1 == "gfx_target_version" { print $2 }' "$properties")
                echo "KFD graphics target: $target"
                if [[ "$target" == 110501 ]]; then
                  verified=true
                fi
              fi
            done
            [[ "$verified" == true ]] || {
              echo "::error::Cannot verify gfx1151: install rocminfo or expose KFD topology."
              exit 1
            }
            verification='KFD topology; ROCm tools are not installed'
          fi
          printf -- '- gfx1151: verified (%s)\n' "$verification" >> "$GITHUB_STEP_SUMMARY"
          for tool in nix hipcc rocminfo rocm-smi amd-smi python3 git ccache; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "$tool: available"
              printf -- '- %s: available\n' "$tool" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "$tool: not on PATH"
              printf -- '- %s: not on PATH\n' "$tool" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          awk '/^MemTotal:/ { printf "Host-visible memory: %.1f GiB\n", $2 / 1048576 }' /proc/meminfo
          printf '\nThis probe verifies runner placement and GPU device access. It does not execute a model or qualify performance.\n' >> "$GITHUB_STEP_SUMMARY"

      # Suites come from the same merge commit as the candidate binary.
      - name: Checkout workflow and test harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize.outputs.merge }}
          persist-credentials: false
          path: controller

      - name: Recreate selection plan and candidate checkout
        timeout-minutes: 5
        env:
          APPROVED_BASE: ${{ needs.authorize.outputs.base }}
          APPROVED_MERGE: ${{ needs.authorize.outputs.merge }}
          RUN_AR: ${{ inputs.ar || false }}
          RUN_BENCHMARK: ${{ inputs.benchmark || false }}
          APPROVED_TIER: ${{ needs.authorize.outputs.tier }}
        shell: bash
        run: |
          set -euo pipefail
          git init --initial-branch=ci candidate
          # The hosted job already pinned the merge and its main parent. Diff/build
          # need only these two snapshots, not their complete ancestor history.
          git -C candidate -c http.lowSpeedLimit=1024 -c http.lowSpeedTime=60 \
            fetch --depth 1 https://github.com/gufo-org/gufo.git "$APPROVED_MERGE" "$APPROVED_BASE"
          git -C candidate checkout --detach "$APPROVED_MERGE"
          base="$APPROVED_BASE"
          modes=()
          [[ "$RUN_AR" == true ]] && modes+=(--ar)
          [[ "$RUN_BENCHMARK" == true ]] && modes+=(--benchmark)
          python3 controller/tests/functional/devlab_plan.py --repo candidate --base "$base" --head "$APPROVED_MERGE" \
            "${modes[@]}" --tier "$APPROVED_TIER" --output functional-plan.json

      # Fetch assets while the two production binaries compile. No mounted weights
      # or voice fixtures are required; the authorized controller includes English audio.
      - name: Start pinned selected-model downloads
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/gufo-weights.status"
          (
            status=0
            (
              set -euo pipefail
              python3 -m venv "$RUNNER_TEMP/gufo-hf-cli"
              "$RUNNER_TEMP/gufo-hf-cli/bin/python" -m pip install 'huggingface_hub[hf_xet]==1.26.0'
              export HF_ENDPOINT=https://huggingface.co
              export HF_HUB_DISABLE_XET=0
              export HF_XET_HIGH_PERFORMANCE=1
              export HF_HUB_DOWNLOAD_TIMEOUT=120
              export HF_HUB_ETAG_TIMEOUT=60
              export HF_HOME="$GUFO_CACHE_ROOT/huggingface"
              "$RUNNER_TEMP/gufo-hf-cli/bin/python" controller/tests/functional/devlab_models.py \
                --plan functional-plan.json --cache "$GUFO_CACHE_ROOT/models" \
                --output functional-assets.json
            ) || status=$?
            echo "$status" > "$RUNNER_TEMP/gufo-weights.status"
          ) > "$RUNNER_TEMP/gufo-weights.log" 2>&1 < /dev/null &
          echo $! > "$RUNNER_TEMP/gufo-weights.pid"

      - name: Configure compiler cache
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ccache >/dev/null 2>&1; then
            echo "::notice::ccache is not installed; builds start from scratch."
            exit 0
          fi
          {
            printf 'CCACHE_DIR=%s\n' "$GUFO_CACHE_ROOT/ccache"
            printf 'CCACHE_BASEDIR=%s\n' "$GITHUB_WORKSPACE"
            printf 'CCACHE_MAXSIZE=20G\n'
            for language in C CXX HIP; do
              printf 'CMAKE_%s_COMPILER_LAUNCHER=ccache\n' "$language"
            done
          } >> "$GITHUB_ENV"
          CCACHE_DIR="$GUFO_CACHE_ROOT/ccache" ccache --zero-stats

      - name: Build Gufo from source
        id: build
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          printf 'Candidate: %s\n' "$(git rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
          cmake --version
          c++ --version
          hipcc --version
          cmake --preset release -DCMAKE_INSTALL_PREFIX="$HOME/.local"
          cmake --build --preset release --parallel 4
          ./build/release/gufo diagnose

      - name: Build main for the phase and benchmark baselines
        id: build_base
        env:
          APPROVED_BASE: ${{ needs.authorize.outputs.base }}
        shell: bash
        run: |
          set -euo pipefail
          git -C candidate worktree add --detach ../baseline "$APPROVED_BASE"
          cd baseline
          printf 'Benchmark baseline: %s\n' "$(git rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
          cmake --preset release -DCMAKE_INSTALL_PREFIX="$HOME/.local"
          cmake --build --preset release --parallel 4

      - name: Wait for pinned selected-model weights
        id: weights
        shell: bash
        run: |
          set -euo pipefail
          while [[ ! -f "$RUNNER_TEMP/gufo-weights.status" ]]; do
            pid=$(cat "$RUNNER_TEMP/gufo-weights.pid")
            kill -0 "$pid" 2>/dev/null || { echo "::error::Asset downloader exited without a result"; exit 1; }
            sleep 5
          done
          # Progress bars redraw with carriage returns; keep their final states.
          tr '\r' '\n' < "$RUNNER_TEMP/gufo-weights.log" | grep -v '^\s*$' | tail -n 60
          status=$(cat "$RUNNER_TEMP/gufo-weights.status" 2>/dev/null || echo 1)
          exit "$status"

      - name: Install functional client dependencies
        id: client
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/gufo-functional-client"
          # Unpinned openai 3.x with a newer httpx breaks every suite in the client.
          "$RUNNER_TEMP/gufo-functional-client/bin/python" -m pip install \
            -r controller/tests/functional/requirements.txt
          # Fail here, not in every suite: metrics.py imports jsonschema lazily.
          cd controller/tests/functional
          "$RUNNER_TEMP/gufo-functional-client/bin/python" -c \
            'import jsonschema, PIL, numpy, httpx, run, openai_sdk, metrics, devlab_run, service_phases'

      - name: Run selected model correctness and paired speed checks
        if: >-
          !cancelled() && steps.build.outcome == 'success' &&
          steps.build_base.outcome == 'success' && steps.weights.outcome == 'success' &&
          steps.client.outcome == 'success'
        shell: bash
        run: |
          "$RUNNER_TEMP/gufo-functional-client/bin/python" controller/tests/functional/devlab_run.py \
            --plan functional-plan.json --assets functional-assets.json \
            --binary candidate/build/release/gufo --base-binary baseline/build/release/gufo \
            --output functional-results --report functional-report --logs phase-logs

      # Suite failures must not hide benchmark observations.
      - name: Benchmark Flash-Next AR through 128K depth on base and PR
        if: >-
          !cancelled() && inputs.benchmark &&
          steps.build.outcome == 'success' && steps.build_base.outcome == 'success' &&
          steps.weights.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p functional-report
          model_dir=$(python3 -c 'import json; print(json.load(open("functional-assets.json"))["flash-next"])')
          # Same runner and weights; main runs first.
          for revision in base head; do
            checkout=candidate
            [[ "$revision" == base ]] && checkout=baseline
            printf '\n### Benchmark: %s\n\n' "$revision" >> "$GITHUB_STEP_SUMMARY"
            "$checkout/build/release/gufo" bench \
              --model "$model_dir/UD-Q4_K_XL/Qwen3.8-Flash-Next-UD-Q4_K_XL-00001-of-00004.gguf" \
              --speculative off --n-prompt 2048 --n-gen 128 \
              --n-depth 0,4096,8192,12288,16384,32768,65536,131072 \
              --repetitions 1 \
              2> >(tee "functional-report/bench-$revision.stderr" >&2) \
              | tee "functional-report/bench-$revision.md"
            cat "functional-report/bench-$revision.md" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Collect report inputs
        if: always()
        shell: bash
        run: |
          mkdir -p functional-report
          [[ -f functional-results/summary.json ]] && cp functional-results/summary.json functional-report/
          true

      - name: Retain report inputs for the PR comment
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: functional-report-${{ github.run_attempt }}
          path: functional-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Retain functional reports and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: model-functional-${{ github.run_attempt }}
          path: |
            functional-plan.json
            functional-assets.json
            functional-results/
            functional-report/
            phase-logs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Report disk and compiler cache, remove temporary environments
        if: always()
        shell: bash
        run: |
          rm -rf -- "$RUNNER_TEMP/gufo-hf-cli" "$RUNNER_TEMP/gufo-functional-client"
          git -C candidate worktree remove --force ../baseline 2>/dev/null || true
          rm -rf -- functional-results
          fence='~~~'
          {
            printf '\n### Disk after run\n\n%stext\n%s\n%s\n' "$fence" \
              "$(df -h "$GITHUB_WORKSPACE" "${GUFO_CACHE_ROOT:-$GITHUB_WORKSPACE}")" "$fence"
            if [[ -n "${CCACHE_DIR:-}" ]]; then
              printf '\n### Compiler cache\n\n%stext\n%s\n%s\n' "$fence" "$(ccache --show-stats)" "$fence"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

  windows:
    name: Selected model checks on Windows Strix Halo
    needs: authorize
    if: needs.authorize.outputs.has_work == 'true'
    runs-on: [ windows, strix-halo, devlab-dispatch ]
    timeout-minutes: 360
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      # Git Bash passes Windows paths to native tools unmodified.
      MSYS_NO_PATHCONV: 1
    steps:
      # Same selection as the Linux job. Pull requests run one quick suite per
      # selected model (the smoke tier); release PRs and full dispatches run
      # the complete correctness set. Windows runs correctness only: no merge
      # base build and no paired timing.
      - name: Clean workspace and check disk space
        run: |
          set -euo pipefail
          rm -rf -- candidate functional-results functional-report functional-plan.json functional-assets.json phase-logs
          cache_root="${GUFO_CI_CACHE:-$RUNNER_TOOL_CACHE/gufo}"
          mkdir -p "$cache_root"
          printf 'GUFO_CACHE_ROOT=%s\n' "$cache_root" >> "$GITHUB_ENV"
          tier=smoke
          [[ "$APPROVED_TIER" == full ]] && tier=full
          printf 'WINDOWS_TIER=%s\n' "$tier" >> "$GITHUB_ENV"
          df -h "$GITHUB_WORKSPACE" "$cache_root"
        env:
          APPROVED_TIER: ${{ needs.authorize.outputs.tier }}

      - name: Verify platform and gfx1151, inventory available tools
        run: |
          set -euo pipefail
          printf '## Devlab Windows Strix Halo check (%s tier)\n\n' "$WINDOWS_TIER" >> "$GITHUB_STEP_SUMMARY"
          [[ "$RUNNER_OS" == Windows && "$RUNNER_ARCH" == X64 ]] || {
            echo "::error::The Windows job requires Windows x86-64."
            exit 1
          }
          # Strix Halo's gfx1151 ships as the Radeon 8040S/8050S/8060S. The
          # HIP enumeration check follows once the SDK is provisioned.
          adapters=$(powershell -NoProfile -Command \
            "(Get-CimInstance Win32_VideoController).Name -join ';'")
          echo "Display adapters: $adapters"
          adapter='Radeon(\(TM\))? 80[456]0S'
          [[ "$adapters" =~ $adapter ]] || {
            echo "::error::No Strix Halo (gfx1151) display adapter."
            exit 1
          }
          verification='display adapter name'
          printf -- '- Windows x86-64: verified\n- gfx1151: verified (%s)\n' "$verification" >> "$GITHUB_STEP_SUMMARY"
          for tool in cmake ninja clang-cl python git ccache vcpkg; do
            if command -v "$tool" >/dev/null 2>&1; then
              printf -- '- %s: available\n' "$tool" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              printf -- '- %s: not on PATH\n' "$tool" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          done
          powershell -NoProfile -Command \
            "'Host-visible memory: {0:N1} GiB' -f ((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB)"
          powercfg /getactivescheme || true

      - name: Checkout workflow and test harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: controller

      - name: Recreate selection plan and candidate checkout
        timeout-minutes: 5
        env:
          APPROVED_BASE: ${{ needs.authorize.outputs.base }}
          APPROVED_HEAD: ${{ needs.authorize.outputs.head }}
        run: |
          set -euo pipefail
          git init --initial-branch=ci candidate
          git -C candidate -c http.lowSpeedLimit=1024 -c http.lowSpeedTime=60 \
            fetch --depth 1 https://github.com/gufo-org/gufo.git "$APPROVED_HEAD" "$APPROVED_BASE"
          git -C candidate checkout --detach "$APPROVED_HEAD"
          python controller/tests/functional/devlab_plan.py --repo candidate --base "$APPROVED_BASE" \
            --head "$APPROVED_HEAD" --tier "$WINDOWS_TIER" --output functional-plan.json
          python - <<'PYPLAN'
          import json, os
          plan = json.load(open('functional-plan.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"\nTier `{plan['tier']}`:\n")
              for group in plan['groups']:
                  summary.write(f"- **{group['profile']}**: {', '.join(group['suites'])}\n")
          PYPLAN

      # The ephemeral runner carries no SDK or C++ package manager: the job
      # provisions a pinned TheRock gfx1151 nightly (HIP_PATH) and vcpkg at
      # the vcpkg.json baseline (VCPKG_ROOT). vcpkg's built packages persist
      # in the Actions cache, keyed by the manifest.
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-archives
          key: gufo-vcpkg-v1-${{ runner.os }}-${{ hashFiles('candidate/vcpkg.json') }}
          restore-keys: |
            gufo-vcpkg-v1-${{ runner.os }}-

      # The 2.4 GiB SDK archive is cached too: the next runs skip the download.
      - name: Restore TheRock SDK archive
        id: therock-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/therock-archive
          key: gufo-therock-v1-therock-dist-windows-gfx1151-7.14.0a20260612

      - name: Provision the TheRock SDK and vcpkg
        id: provision
        env:
          THEROCK_TARBALL: therock-dist-windows-gfx1151-7.14.0a20260612.tar.gz
        run: |
          set -euo pipefail
          toolchain="$RUNNER_TEMP/gufo-toolchain"
          archive="$RUNNER_TEMP/therock-archive/$THEROCK_TARBALL"
          rm -rf -- "$toolchain"
          mkdir -p "$toolchain/therock" "$RUNNER_TEMP/vcpkg-archives" "$RUNNER_TEMP/therock-archive"
          if [[ ! -f "$archive" ]]; then
            # The CloudFront mirror of the nightly bucket: the raw S3 endpoint
            # crawls at tens of KB/s from this runner. Stalls below 1 MB/s for
            # two minutes fail the job instead of running into the timeout.
            curl -fL --retry 3 --retry-delay 10 --speed-limit 1048576 --speed-time 120 \
              --no-progress-meter -o "$archive.part" \
              "https://rocm.nightlies.amd.com/tarball/$THEROCK_TARBALL"
            mv -- "$archive.part" "$archive"
          fi
          echo "archive=ready" >> "$GITHUB_OUTPUT"
          # --force-local: GNU tar would read "C:..." as a remote host.
          tar --force-local -xzf "$archive" -C "$toolchain/therock"
          baseline=$(python -c 'import json; print(json.load(open("candidate/vcpkg.json"))["builtin-baseline"])')
          git clone --quiet https://github.com/microsoft/vcpkg.git "$toolchain/vcpkg"
          git -C "$toolchain/vcpkg" checkout --quiet --detach "$baseline"
          cmd.exe /d /c "$(cygpath -w "$toolchain/vcpkg/bootstrap-vcpkg.bat") -disableMetrics"
          {
            printf 'HIP_PATH=%s\n' "$(cygpath -w "$toolchain/therock")"
            printf 'VCPKG_ROOT=%s\n' "$(cygpath -w "$toolchain/vcpkg")"
            printf 'VCPKG_DEFAULT_BINARY_CACHE=%s\n' "$(cygpath -w "$RUNNER_TEMP/vcpkg-archives")"
          } >> "$GITHUB_ENV"
          printf -- '- TheRock: %s\n- vcpkg baseline: %s\n' "$THEROCK_TARBALL" "$baseline" >> "$GITHUB_STEP_SUMMARY"
          "$toolchain/therock/bin/hipInfo.exe" | tee "$RUNNER_TEMP/devlab-hipinfo.txt"
          grep -Eq 'gfx1151' "$RUNNER_TEMP/devlab-hipinfo.txt" || {
            echo "::error::HIP did not enumerate a gfx1151 device."
            exit 1
          }
          printf -- '- gfx1151: verified (HIP device enumeration)\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Configure compiler cache
        run: |
          set -euo pipefail
          if ! command -v ccache >/dev/null 2>&1; then
            echo "::notice::ccache is not installed; builds start from scratch."
            exit 0
          fi
          {
            printf 'CCACHE_DIR=%s\n' "$GUFO_CACHE_ROOT/ccache"
            printf 'CCACHE_BASEDIR=%s\n' "$GITHUB_WORKSPACE"
            printf 'CCACHE_MAXSIZE=20G\n'
            for language in C CXX HIP; do
              printf 'CMAKE_%s_COMPILER_LAUNCHER=ccache\n' "$language"
            done
          } >> "$GITHUB_ENV"
          CCACHE_DIR="$GUFO_CACHE_ROOT/ccache" ccache --zero-stats

      # MSVC 14.40+ clashes with clang's HIP math headers; the script is
      # idempotent and the ephemeral runner starts from a clean SDK.
      - name: Patch the HIP SDK math headers
        run: python candidate/tools/windows/patch_sdk_math.py "$HIP_PATH"

      # A Windows step ends with its process tree, so the downloads overlap the
      # build inside one step instead of running in the background across steps.
      - name: Build Gufo and fetch the selected weights
        id: build
        run: |
          set -euo pipefail
          (
            set -euo pipefail
            python -m venv "$RUNNER_TEMP/gufo-hf-cli"
            "$RUNNER_TEMP/gufo-hf-cli/Scripts/python.exe" -m pip install 'huggingface_hub[hf_xet]==1.26.0'
            export HF_ENDPOINT=https://huggingface.co HF_HUB_DISABLE_XET=0 HF_XET_HIGH_PERFORMANCE=1
            export HF_HUB_DOWNLOAD_TIMEOUT=120 HF_HUB_ETAG_TIMEOUT=60 HF_HOME="$GUFO_CACHE_ROOT/huggingface"
            "$RUNNER_TEMP/gufo-hf-cli/Scripts/python.exe" controller/tests/functional/devlab_models.py \
              --plan functional-plan.json --cache "$GUFO_CACHE_ROOT/models" --output functional-assets.json
          ) > "$RUNNER_TEMP/gufo-weights.log" 2>&1 < /dev/null &
          downloads=$!
          build=0
          (
            cd candidate
            printf 'Candidate: %s\n' "$(git rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
            cmd.exe /d /c "call tools\\windows\\vs-env.cmd cmake --preset windows-release && call tools\\windows\\vs-env.cmd cmake --build --preset windows-release --parallel 4"
            [[ -f build/windows-release/gufo.exe ]] || {
              echo "::error::build/windows-release/gufo.exe was not built."
              exit 1
            }
            ./build/windows-release/gufo.exe diagnose
          ) || build=$?
          weights=0
          if [[ "$build" != 0 ]]; then
            # Nothing can use the weights: fail now. The step's process tree,
            # downloader included, ends with it.
            kill "$downloads" 2>/dev/null || true
            echo "::error::The Windows build failed ($build)."
            exit 1
          fi
          wait "$downloads" || weights=$?
          tr '\r' '\n' < "$RUNNER_TEMP/gufo-weights.log" | grep -v '^\s*$' | tail -n 60
          [[ "$weights" == 0 ]] || echo "::error::Selected-model downloads failed ($weights)."
          [[ "$build" == 0 && "$weights" == 0 ]]

      - name: Save TheRock SDK archive
        if: always() && steps.therock-cache.outputs.cache-hit != 'true' && steps.provision.outputs.archive == 'ready'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/therock-archive
          key: gufo-therock-v1-therock-dist-windows-gfx1151-7.14.0a20260612

      # Saved even when the build fails, so the next run skips the packages
      # that did build.
      - name: Save vcpkg binary cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-archives
          key: gufo-vcpkg-v1-${{ runner.os }}-${{ hashFiles('candidate/vcpkg.json') }}

      - name: Install functional client dependencies
        id: client
        run: |
          python -m venv "$RUNNER_TEMP/gufo-functional-client"
          "$RUNNER_TEMP/gufo-functional-client/Scripts/python.exe" -m pip install \
            -r controller/tests/functional/requirements.txt
          cd controller/tests/functional
          "$RUNNER_TEMP/gufo-functional-client/Scripts/python.exe" -c \
            'import jsonschema, PIL, numpy, httpx, run, openai_sdk, metrics, devlab_run'

      - name: Run selected model correctness checks
        if: >-
          !cancelled() && steps.build.outcome == 'success' && steps.client.outcome == 'success'
        run: |
          "$RUNNER_TEMP/gufo-functional-client/Scripts/python.exe" controller/tests/functional/devlab_run.py \
            --plan functional-plan.json --assets functional-assets.json \
            --binary candidate/build/windows-release/gufo.exe --no-timing \
            --output functional-results --report functional-report --logs phase-logs

      - name: Summarize results
        if: always()
        run: |
          [[ -f functional-report/summary.json ]] || exit 0
          python - <<'PYSUMMARY'
          import json, os
          summary = json.load(open('functional-report/summary.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(f"\n### Results: {summary['status']}\n\n| Model | Correctness |\n|---|---|\n")
              for model in summary['models']:
                  out.write(f"| {model['id']} | {model['correctness']} |\n")
          PYSUMMARY

      - name: Retain functional reports and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-functional-${{ github.run_attempt }}
          path: |
            functional-plan.json
            functional-assets.json
            functional-results/
            functional-report/
            phase-logs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Report disk and compiler cache, remove temporary environments
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/gufo-hf-cli" "$RUNNER_TEMP/gufo-functional-client" \
            "$RUNNER_TEMP/gufo-toolchain" functional-results
          df -h "$GITHUB_WORKSPACE" "${GUFO_CACHE_ROOT:-$GITHUB_WORKSPACE}" || true
          if [[ -n "${CCACHE_DIR:-}" ]]; then ccache --show-stats; fi

  report:
    name: Publish functional report
    needs: [ authorize, smoke ]
    # Hosted job: the PR write token never reaches the GPU host.
    if: always() && needs.authorize.outputs.head != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - name: Checkout report renderer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: tests/functional

      - name: Download selection plan
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: functional-plan-${{ github.run_attempt }}
          path: report-input

      - name: Download cluster report inputs
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: functional-report-${{ github.run_attempt }}
          path: report-input/results

      - name: Render comment and status
        env:
          AUTHORIZE_RESULT: ${{ needs.authorize.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
          RUN_BENCHMARK: ${{ inputs.benchmark || false }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p report-input/results
          benchmark=()
          [[ "$RUN_BENCHMARK" == true ]] && benchmark=(--benchmark)
          python3 tests/functional/report.py --plan report-input/functional-plan.json \
            --results report-input/results --authorize "$AUTHORIZE_RESULT" \
            --smoke "$SMOKE_RESULT" --run-url "$RUN_URL" "${benchmark[@]}" \
            --comment comment.md --status status.env
          cat comment.md >> "$GITHUB_STEP_SUMMARY"

      # A fork PR's token cannot comment or set statuses; devlab-comment.yml
      # publishes this report from the base repository instead.
      - name: Retain report for fork publishing
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: functional-comment
          path: |
            comment.md
            status.env

      - name: Publish PR comment and advisory status
        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.authorize.outputs.pr }}
          HEAD_SHA: ${{ needs.authorize.outputs.head }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          state=$(sed -n 's/^state=//p' status.env)
          description=$(sed -n 's/^description=//p' status.env)
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" -f state="$state" \
            -f context=devlab/functional -f description="${description:0:140}" \
            -f target_url="$RUN_URL" --silent
          # Update one comment per PR instead of adding one per run.
          comment_id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and
                               (.body | startswith("<!-- devlab-functional -->"))) | .id' | head -1)
          if [[ -n "$comment_id" ]]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -F body=@comment.md --silent
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -F body=@comment.md --silent
          fi
