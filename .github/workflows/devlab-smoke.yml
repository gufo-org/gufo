name: Devlab functional checks

on:
  # Same trigger and fork approval policy as CI. The check is advisory: it is
  # not required for merging.
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR to test (head pinned at authorization)
        required: true
        type: string
      tier:
        description: pr trims suites and transports; full runs the complete set (release PRs)
        type: choice
        options: [ full, pr ]
        default: full
      ar:
        description: Also run the functional suites in AR (speculative off); MTP always runs
        default: false
        type: boolean
      benchmark:
        description: Also benchmark native AR through 128K on the PR and its merge base
        default: false
        type: boolean

permissions: {}

# A new push supersedes the PR's queued or running check.
concurrency:
  group: devlab-functional-${{ inputs.pr_number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  authorize:
    name: Authorize functional checks
    if: >-
      github.repository == 'gufo-org/gufo' &&
      (github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      head: ${{ steps.revision.outputs.head }}
      pr: ${{ steps.revision.outputs.pr }}
      has_work: ${{ steps.plan.outputs.has_work }}
      scope: ${{ steps.plan.outputs.scope }}
      base: ${{ steps.plan.outputs.base }}
      tier: ${{ steps.plan.outputs.tier }}
    permissions:
      contents: read
      statuses: write # fork PR tokens stay read-only
    steps:
      # Pull requests follow the repository's fork approval policy, like CI.
      # Dispatches require Maintain or Admin.
      - name: Authorize dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_ACTOR: ${{ github.actor }}
          RERUN_ACTOR: ${{ github.triggering_actor }}
        shell: bash
        run: |
          set -euo pipefail
          for actor in "$DISPATCH_ACTOR" "$RERUN_ACTOR"; do
            role=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$actor/permission" \
              --jq .role_name 2>/dev/null || true)
            case "$role" in
              admin|maintain) echo "Authorized $actor" ;;
              *) echo "::error::Dispatching functional checks requires Maintain or Admin access."; exit 1 ;;
            esac
          done

      - name: Pin PR head
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "::error::Invalid PR number"; exit 1; }
          # Test the revision that triggered the event; a later push starts its own run.
          head=${EVENT_HEAD:-$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)}
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "pr=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      # Advisory only: devlab/functional is not a required check, so cluster
      # problems never block merging.
      - name: Mark advisory status pending
        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.revision.outputs.head }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" -f state=pending \
            -f context=devlab/functional -f description="Planning functional checks" \
            -f target_url="$RUN_URL" --silent

      - name: Checkout workflow and test harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Validate functional impact rules and report rendering
        run: |
          python3 -m unittest discover -s tests/functional -p test_impact.py
          python3 -m unittest discover -s tests/functional -p test_report.py

      - name: Select affected Flash-Next suites
        id: plan
        env:
          PR_NUMBER: ${{ steps.revision.outputs.pr }}
          APPROVED_HEAD: ${{ steps.revision.outputs.head }}
          RUN_BENCHMARK: ${{ inputs.benchmark || false }}
          RUN_AR: ${{ inputs.ar || false }}
          DISPATCH_TIER: ${{ inputs.tier }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          # Release PRs run the complete set; other PRs the pr tier.
          tier="pr"
          [[ "$HEAD_REF" == release-please--* ]] && tier=full
          [[ -n "$DISPATCH_TIER" ]] && tier="$DISPATCH_TIER"
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
          # MTP exercises the AR verification path too; AR-only coverage is opt-in.
          scope=flash-next-q4/mtp
          [[ "$RUN_AR" == true ]] && scope=flash-next-q4
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          git fetch https://github.com/gufo-org/gufo.git "refs/pull/$PR_NUMBER/head:refs/ci/pr" main:refs/ci/main
          [[ "$(git rev-parse refs/ci/pr)" == "$APPROVED_HEAD" ]] || {
            echo "::error::PR changed after this run started; the new push starts its own run."
            exit 1
          }
          base=$(git merge-base refs/ci/main "$APPROVED_HEAD")
          echo "base=$base" >> "$GITHUB_OUTPUT"
          python3 tests/functional/impact.py --repo . --base "$base" --head "$APPROVED_HEAD" \
            --model "$scope" --tier "$tier" --output functional-plan.json
          python3 - <<'PYPLAN'
          import json, os
          plan = json.load(open('functional-plan.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              work = bool(plan['groups']) or os.environ['RUN_BENCHMARK'] == 'true'
              print('has_work=' + str(work).lower(), file=output)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Changed-file functional plan\n\n')
              summary.write(f"Revisions: `{plan['base']}` → `{plan['head']}`; tier `{plan['tier']}`.\n\n")
              for path in plan['paths']:
                  summary.write(f"- `{path['path']}` → {', '.join(path['rules'])}\n")
              for group in plan['groups']:
                  summary.write(f"\n**{group['profile']} / {group['configuration']}**: " + ', '.join(group['suites']) + '\n')
              summary.write(f"\nDeferred: {len(plan['deferred'])}; release run only: {len(plan['release_only'])}; outside scope {', '.join(plan['scope'])}: {len(plan['out_of_scope'])}.\n")
              summary.write('Candidate correctness only. Other-model, numerical, agent replay and timing qualification remain separate obligations.\n')
          PYPLAN

      - name: Retain selection plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: functional-plan-${{ github.run_attempt }}
          path: functional-plan.json

  smoke:
    name: Flash-Next functional checks on Strix Halo
    needs: authorize
    if: needs.authorize.outputs.has_work == 'true'
    runs-on: [ linux, strix-halo, devlab-dispatch ]
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      # Self-hosted workspaces persist between runs; start from a clean tree.
      - name: Clean workspace and check disk space
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- candidate baseline functional-results functional-report functional-plan.json phase-logs
          # The 63 GB home overlay cannot hold the 104 GiB weights.
          cache_root="${GUFO_CI_CACHE:-$RUNNER_TOOL_CACHE/gufo}"
          mkdir -p "$cache_root"
          printf 'GUFO_CACHE_ROOT=%s\n' "$cache_root" >> "$GITHUB_ENV"
          df -h "$GITHUB_WORKSPACE" "$cache_root"
          fence='~~~'
          printf '### Disk before run\n\n%stext\n%s\n%s\n\n' "$fence" \
            "$(df -h "$GITHUB_WORKSPACE" "$cache_root")" "$fence" >> "$GITHUB_STEP_SUMMARY"

      # Run only the SHA pinned by the hosted authorize job.
      - name: Verify platform and GPU device access
        shell: bash
        run: |
          set -euo pipefail
          printf '## Devlab Strix Halo smoke test\n\n' >> "$GITHUB_STEP_SUMMARY"
          uname -srm
          [[ "$(uname -s)" == Linux && "$(uname -m)" == x86_64 ]] || {
            echo "::error::Gufo requires Linux x86-64."
            exit 1
          }
          [[ -c /dev/kfd && -r /dev/kfd && -w /dev/kfd ]] || {
            echo "::error::The runner needs read/write access to /dev/kfd."
            exit 1
          }
          render_access=false
          for device in /dev/dri/renderD*; do
            if [[ -c "$device" && -r "$device" && -w "$device" ]]; then
              echo "Accessible render device: $device"
              render_access=true
            fi
          done
          [[ "$render_access" == true ]] || {
            echo "::error::No accessible DRM render device."
            exit 1
          }
          printf -- '- Linux x86-64: verified\n- KFD/render device access: verified\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Report power profile and exposed limits
        shell: bash
        run: |
          set -euo pipefail
          printf '\n### Power configuration\n\n```text\n' >> "$GITHUB_STEP_SUMMARY"
          report_file() {
            local path="$1" value
            if [[ -r "$path" ]] && value=$(cat "$path" 2>/dev/null); then
              printf '%s: %s\n' "$path" "$value" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          }
          report_file /sys/firmware/acpi/platform_profile
          report_file /sys/firmware/acpi/platform_profile_choices
          for path in /sys/class/platform-profile/*/profile \
                      /sys/class/platform-profile/*/choices \
                      /sys/devices/system/cpu/cpufreq/policy*/scaling_governor \
                      /sys/devices/system/cpu/cpufreq/policy*/energy_performance_preference; do
            report_file "$path"
          done
          for device in /sys/class/drm/card*/device; do
            [[ -r "$device/vendor" ]] || continue
            [[ "$(cat "$device/vendor")" == 0x1002 ]] || continue
            report_file "$device/power_dpm_force_performance_level"
            report_file "$device/pp_power_profile_mode"
            for hwmon in "$device"/hwmon/hwmon*; do
              report_file "$hwmon/name"
              for metric in power1_cap power1_cap_default power1_cap_min power1_cap_max; do
                path="$hwmon/$metric"
                if [[ -r "$path" ]] && value=$(cat "$path" 2>/dev/null); then
                  awk -v path="$path" -v value="$value" \
                    'BEGIN { printf "%s: %.3f W\n", path, value / 1000000 }' \
                    | tee -a "$GITHUB_STEP_SUMMARY"
                fi
              done
            done
          done
          printf '```\n\nUnavailable interfaces are omitted. These readings do not establish the firmware APU TDP when it is not exposed to the runner.\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Verify gfx1151 and inventory available tools
        shell: bash
        run: |
          set -euo pipefail
          rocminfo_bin=$(command -v rocminfo || true)
          if [[ -z "$rocminfo_bin" && -x /opt/rocm/bin/rocminfo ]]; then
            rocminfo_bin=/opt/rocm/bin/rocminfo
          fi
          if [[ -n "$rocminfo_bin" ]]; then
            "$rocminfo_bin" > "$RUNNER_TEMP/devlab-rocminfo.txt"
            cat "$RUNNER_TEMP/devlab-rocminfo.txt"
            grep -Eq 'Name:[[:space:]]+gfx1151([[:space:]]|$)' "$RUNNER_TEMP/devlab-rocminfo.txt" || {
              echo "::error::ROCm did not enumerate a gfx1151 agent."
              exit 1
            }
            verification='ROCm agent enumeration'
          else
            # KFD encodes gfx1151 as major 11, minor 5, stepping 1.
            verified=false
            for properties in /sys/class/kfd/kfd/topology/nodes/*/properties; do
              if [[ -r "$properties" ]]; then
                target=$(awk '$1 == "gfx_target_version" { print $2 }' "$properties")
                echo "KFD graphics target: $target"
                if [[ "$target" == 110501 ]]; then
                  verified=true
                fi
              fi
            done
            [[ "$verified" == true ]] || {
              echo "::error::Cannot verify gfx1151: install rocminfo or expose KFD topology."
              exit 1
            }
            verification='KFD topology; ROCm tools are not installed'
          fi
          printf -- '- gfx1151: verified (%s)\n' "$verification" >> "$GITHUB_STEP_SUMMARY"
          for tool in nix hipcc rocminfo rocm-smi amd-smi python3 git ccache; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "$tool: available"
              printf -- '- %s: available\n' "$tool" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "$tool: not on PATH"
              printf -- '- %s: not on PATH\n' "$tool" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          awk '/^MemTotal:/ { printf "Host-visible memory: %.1f GiB\n", $2 / 1048576 }' /proc/meminfo
          printf '\nThis probe verifies runner placement and GPU device access. It does not execute a model or qualify performance.\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout workflow and test harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: controller

      - name: Recreate selection plan and candidate checkout
        env:
          APPROVED_BASE: ${{ needs.authorize.outputs.base }}
          APPROVED_HEAD: ${{ needs.authorize.outputs.head }}
          APPROVED_SCOPE: ${{ needs.authorize.outputs.scope }}
          APPROVED_TIER: ${{ needs.authorize.outputs.tier }}
        shell: bash
        run: |
          set -euo pipefail
          git init candidate
          git -C candidate fetch https://github.com/gufo-org/gufo.git "$APPROVED_HEAD" "$APPROVED_BASE"
          git -C candidate checkout --detach "$APPROVED_HEAD"
          base="$APPROVED_BASE"
          python3 controller/tests/functional/impact.py --repo candidate --base "$base" --head "$APPROVED_HEAD" \
            --model "$APPROVED_SCOPE" --tier "$APPROVED_TIER" --output functional-plan.json

      - name: Prepare persistent model cache
        shell: bash
        run: |
          set -euo pipefail
          model_dir="$GUFO_CACHE_ROOT/models/flash-next/38bb39ee97821de2c9009abb7e93950eec396e66"
          mkdir -p "$model_dir"
          printf 'GUFO_MODEL_DIR=%s\n' "$model_dir" >> "$GITHUB_ENV"
          # Weights total about 104 GiB; require the remainder plus headroom.
          required_kib=$((110 * 1024 * 1024 - $(du -sk "$model_dir" | cut -f1)))
          available_kib=$(df --output=avail -k "$model_dir" | tail -1)
          if (( available_kib < required_kib )); then
            echo "::error::Model cache needs $((required_kib / 1048576)) GiB more; $((available_kib / 1048576)) GiB free at $model_dir."
            exit 1
          fi

      # Weights are network bound and the builds CPU bound: download in the
      # background and wait for it before the suites need the files.
      - name: Start pinned Flash-Next Q4 weight download
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/gufo-weights.sh" <<'SCRIPT'
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/gufo-hf-cli"
          "$RUNNER_TEMP/gufo-hf-cli/bin/python" -m pip install 'huggingface_hub[hf_xet]'
          # The cluster mirror times out on HEAD requests for the large shards.
          export HF_ENDPOINT=https://huggingface.co
          export HF_HUB_DISABLE_XET=0
          export HF_XET_HIGH_PERFORMANCE=1
          export HF_HUB_DOWNLOAD_TIMEOUT=120
          export HF_HUB_ETAG_TIMEOUT=60
          printf 'Hugging Face endpoint: %s\n' "${HF_ENDPOINT:-https://huggingface.co}"
          printf 'Xet disabled by runner: %s\n' "${HF_HUB_DISABLE_XET:-0}"
          export HF_HOME="$GUFO_CACHE_ROOT/huggingface"
          df -h "$GUFO_MODEL_DIR"
          downloaded=false
          for attempt in 1 2 3; do
            # Repeat --include: extra values after one flag become explicit
            # filenames, which makes the CLI ignore the shard pattern.
            if "$RUNNER_TEMP/gufo-hf-cli/bin/hf" download unsloth/Qwen3.8-Flash-Next-GGUF \
              --revision 38bb39ee97821de2c9009abb7e93950eec396e66 \
              --include 'UD-Q4_K_XL/*.gguf' \
              --include 'MTP/mtp-Qwen3.8-Flash-Next-shared-Q8_0.gguf' \
              --include 'mmproj-BF16.gguf' \
              --local-dir "$GUFO_MODEL_DIR"; then
              downloaded=true
              break
            fi
            echo "::warning::Download attempt $attempt failed; retaining partial files for resume."
          done
          [[ "$downloaded" == true ]] || {
            echo "::error::Flash-Next download failed after three attempts."
            exit 1
          }
          for file in UD-Q4_K_XL/Qwen3.8-Flash-Next-UD-Q4_K_XL-0000{1,2,3,4}-of-00004.gguf \
                      MTP/mtp-Qwen3.8-Flash-Next-shared-Q8_0.gguf mmproj-BF16.gguf; do
            [[ -s "$GUFO_MODEL_DIR/$file" ]] || {
              echo "::error::Missing weight file after download: $file"
              exit 1
            }
          done
          du -sh "$GUFO_MODEL_DIR"
          SCRIPT
          rm -f "$RUNNER_TEMP/gufo-weights.status"
          # The job outlives this step; the runner reaps the process at job end.
          (
            status=0
            bash "$RUNNER_TEMP/gufo-weights.sh" || status=$?
            echo "$status" > "$RUNNER_TEMP/gufo-weights.status"
          ) > "$RUNNER_TEMP/gufo-weights.log" 2>&1 < /dev/null &
          echo $! > "$RUNNER_TEMP/gufo-weights.pid"

      - name: Configure compiler cache
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ccache >/dev/null 2>&1; then
            echo "::notice::ccache is not installed; builds start from scratch."
            exit 0
          fi
          {
            printf 'CCACHE_DIR=%s\n' "$GUFO_CACHE_ROOT/ccache"
            printf 'CCACHE_BASEDIR=%s\n' "$GITHUB_WORKSPACE"
            printf 'CCACHE_MAXSIZE=20G\n'
            for language in C CXX HIP; do
              printf 'CMAKE_%s_COMPILER_LAUNCHER=ccache\n' "$language"
            done
          } >> "$GITHUB_ENV"
          CCACHE_DIR="$GUFO_CACHE_ROOT/ccache" ccache --zero-stats

      - name: Build Gufo from source
        id: build
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          printf 'Candidate: %s\n' "$(git rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
          cmake --version
          c++ --version
          hipcc --version
          cmake --preset release -DCMAKE_INSTALL_PREFIX="$HOME/.local"
          cmake --build --preset release --parallel 4
          ./build/release/gufo diagnose

      - name: Build merge base for the phase and benchmark baselines
        id: build_base
        env:
          APPROVED_BASE: ${{ needs.authorize.outputs.base }}
        shell: bash
        run: |
          set -euo pipefail
          git -C candidate worktree add --detach ../baseline "$APPROVED_BASE"
          cd baseline
          printf 'Benchmark baseline: %s\n' "$(git rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
          cmake --preset release -DCMAKE_INSTALL_PREFIX="$HOME/.local"
          cmake --build --preset release --parallel 4

      - name: Wait for pinned Flash-Next Q4 weights
        id: weights
        shell: bash
        run: |
          set -euo pipefail
          pid=$(cat "$RUNNER_TEMP/gufo-weights.pid")
          while kill -0 "$pid" 2>/dev/null; do sleep 5; done
          # Progress bars redraw with carriage returns; keep their final states.
          tr '\r' '\n' < "$RUNNER_TEMP/gufo-weights.log" | grep -v '^\s*$' | tail -n 60
          status=$(cat "$RUNNER_TEMP/gufo-weights.status" 2>/dev/null || echo 1)
          exit "$status"

      - name: Install functional client dependencies
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/gufo-functional-client"
          # Unpinned openai 3.x with a newer httpx breaks every suite in the client.
          "$RUNNER_TEMP/gufo-functional-client/bin/python" -m pip install \
            -r controller/tests/functional/requirements.txt
          # Fail here, not in every suite: metrics.py imports jsonschema lazily.
          cd controller/tests/functional
          "$RUNNER_TEMP/gufo-functional-client/bin/python" -c \
            'import jsonschema, PIL, run, openai_sdk, metrics, image_inputs, tool_agent, tool_reasoning'

      - name: Run selected functional suites
        shell: bash
        run: |
          "$RUNNER_TEMP/gufo-functional-client/bin/python" controller/tests/functional/cluster.py \
            --plan functional-plan.json --binary candidate/build/release/gufo \
            --weights "$GUFO_MODEL_DIR" --output functional-results

      # Timing observations only: they never change the advisory verdict, and
      # suite failures must not hide them.
      - name: Time inference phases on base and PR
        if: >-
          !cancelled() && steps.build.outcome == 'success' &&
          steps.build_base.outcome == 'success' && steps.weights.outcome == 'success'
        env:
          APPROVED_BASE: ${{ needs.authorize.outputs.base }}
          APPROVED_HEAD: ${{ needs.authorize.outputs.head }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p functional-report
          python3 controller/tests/functional/phases.py \
            --base-binary baseline/build/release/gufo --head-binary candidate/build/release/gufo \
            --base-revision "$APPROVED_BASE" --head-revision "$APPROVED_HEAD" \
            --weights "$GUFO_MODEL_DIR" --output functional-report/phases.json --logs phase-logs

      # Suite failures must not hide benchmark observations.
      - name: Benchmark Flash-Next AR through 128K depth on base and PR
        if: >-
          !cancelled() && inputs.benchmark &&
          steps.build.outcome == 'success' && steps.build_base.outcome == 'success' &&
          steps.weights.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p functional-report
          # Same runner and weights; the merge base runs first.
          for revision in base head; do
            checkout=candidate
            [[ "$revision" == base ]] && checkout=baseline
            printf '\n### Benchmark: %s\n\n' "$revision" >> "$GITHUB_STEP_SUMMARY"
            "$checkout/build/release/gufo" bench \
              --model "$GUFO_MODEL_DIR/UD-Q4_K_XL/Qwen3.8-Flash-Next-UD-Q4_K_XL-00001-of-00004.gguf" \
              --speculative off --n-prompt 2048 --n-gen 128 \
              --n-depth 0,4096,8192,12288,16384,32768,65536,131072 \
              --repetitions 1 \
              2> >(tee "functional-report/bench-$revision.stderr" >&2) \
              | tee "functional-report/bench-$revision.md"
            cat "functional-report/bench-$revision.md" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Collect report inputs
        if: always()
        shell: bash
        run: |
          mkdir -p functional-report
          [[ -f functional-results/summary.json ]] && cp functional-results/summary.json functional-report/
          true

      - name: Retain report inputs for the PR comment
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: functional-report-${{ github.run_attempt }}
          path: functional-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Retain functional reports and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flash-next-functional-${{ github.run_attempt }}
          path: |
            functional-plan.json
            functional-results/
            functional-report/
            phase-logs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Report disk and compiler cache, remove temporary environments
        if: always()
        shell: bash
        run: |
          rm -rf -- "$RUNNER_TEMP/gufo-hf-cli" "$RUNNER_TEMP/gufo-functional-client"
          git -C candidate worktree remove --force ../baseline 2>/dev/null || true
          rm -rf -- functional-results
          fence='~~~'
          {
            printf '\n### Disk after run\n\n%stext\n%s\n%s\n' "$fence" \
              "$(df -h "$GITHUB_WORKSPACE" "${GUFO_CACHE_ROOT:-$GITHUB_WORKSPACE}")" "$fence"
            if [[ -n "${CCACHE_DIR:-}" ]]; then
              printf '\n### Compiler cache\n\n%stext\n%s\n%s\n' "$fence" "$(ccache --show-stats)" "$fence"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

  report:
    name: Publish functional report
    needs: [ authorize, smoke ]
    # Hosted job: the PR write token never reaches the GPU host.
    if: always() && needs.authorize.outputs.head != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - name: Checkout report renderer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: tests/functional

      - name: Download selection plan
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: functional-plan-${{ github.run_attempt }}
          path: report-input

      - name: Download cluster report inputs
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: functional-report-${{ github.run_attempt }}
          path: report-input/results

      - name: Render comment and status
        env:
          AUTHORIZE_RESULT: ${{ needs.authorize.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
          RUN_BENCHMARK: ${{ inputs.benchmark || false }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p report-input/results
          benchmark=()
          [[ "$RUN_BENCHMARK" == true ]] && benchmark=(--benchmark)
          python3 tests/functional/report.py --plan report-input/functional-plan.json \
            --results report-input/results --authorize "$AUTHORIZE_RESULT" \
            --smoke "$SMOKE_RESULT" --run-url "$RUN_URL" "${benchmark[@]}" \
            --comment comment.md --status status.env
          cat comment.md >> "$GITHUB_STEP_SUMMARY"

      # A fork PR's token cannot comment or set statuses; devlab-comment.yml
      # publishes this report from the base repository instead.
      - name: Retain report for fork publishing
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: functional-comment
          path: |
            comment.md
            status.env

      - name: Publish PR comment and advisory status
        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.authorize.outputs.pr }}
          HEAD_SHA: ${{ needs.authorize.outputs.head }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          state=$(sed -n 's/^state=//p' status.env)
          description=$(sed -n 's/^description=//p' status.env)
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" -f state="$state" \
            -f context=devlab/functional -f description="${description:0:140}" \
            -f target_url="$RUN_URL" --silent
          # Update one comment per PR instead of adding one per run.
          comment_id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and
                               (.body | startswith("<!-- devlab-functional -->"))) | .id' | head -1)
          if [[ -n "$comment_id" ]]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -F body=@comment.md --silent
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -F body=@comment.md --silent
          fi
