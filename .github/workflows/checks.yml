name: Repository checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Run CPU and repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run functional harness tests
        run: |
          python3 -m unittest discover -s tests/functional -p test_impact.py
          python3 -m unittest discover -s tests/functional -p test_report.py
          python3 -m unittest discover -s tests/functional -p test_devlab.py

      - name: Compute compiler cache key
        id: ccache-key
        shell: bash
        run: echo "epoch-week=$(( $(date -u +%s) / 604800 ))" >> "$GITHUB_OUTPUT"

      # Actions cache entries are immutable: save each run under a fresh key
      # so an early empty archive cannot freeze the compiler cache for a week.
      # Restore and save separately: the combined action saves only after a
      # successful job, so a cold run that times out would never seed a cache.
      - name: Restore compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/gufo-ccache
          key: gufo-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}-${{ steps.ccache-key.outputs.epoch-week }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            gufo-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}-

      - name: Restore Rust compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/gufo-rust-cache
          key: gufo-rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            gufo-rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-
            gufo-rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'rust-toolchain.toml') }}-

      - name: Prepare compiler cache
        shell: bash
        run: |
          mkdir -p /tmp/gufo-ccache
          chmod -R a+rwX /tmp/gufo-ccache
          chmod 1777 /tmp/gufo-ccache
          mkdir -p /tmp/gufo-rust-cache
          chmod -R a+rwX /tmp/gufo-rust-cache
          chmod 1777 /tmp/gufo-rust-cache

      # A pull request saves its compiler caches only when the run added at
      # least 32 MiB to them; otherwise a rerun restores the same copy and
      # recompiles little, and the PR keeps no duplicate of main's cache.
      - name: Snapshot restored compiler caches
        continue-on-error: true
        if: github.event_name == 'pull_request'
        run: |
          python3 tools/ci/cache_growth.py snapshot /tmp/gufo-ccache "$RUNNER_TEMP/cache-growth/ccache.json"
          python3 tools/ci/cache_growth.py snapshot /tmp/gufo-rust-cache "$RUNNER_TEMP/cache-growth/rust.json"

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          determinate: false
          extra-conf: |
            extra-substituters = https://gufo.cachix.org
            extra-trusted-public-keys = gufo.cachix.org-1:rfZe3n4lHINgyoACKzs5EthIZmBNvEyCCtufUpth0PE=
            extra-sandbox-paths = /tmp/gufo-ccache /tmp/gufo-rust-cache

      # Pull on every run; push only from main so pull requests do not fill
      # the cache. Fork pull requests receive no token and only pull.
      - name: Enable Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: gufo
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.event_name == 'pull_request' }}
          pushFilter: '(-source$|\.tar\.gz$)'

      - name: Enable Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          use-flakehub: false
          use-gha-cache: true

      # Stop below the job limit so the caches below still save what a cold
      # or slow run compiled; the rerun then starts warm. Cold runs take about
      # 25 minutes and warm ones about 16.
      - name: Run CPU and repository checks
        id: check
        timeout-minutes: 32
        run: |
          nix flake check --print-build-logs --cores "$(nproc)" --max-jobs 2

      # An empty result, such as from a failed measurement, saves.
      - name: Measure compiler cache growth
        continue-on-error: true
        id: growth
        if: always() && github.event_name == 'pull_request' && contains(fromJSON('["success", "failure", "cancelled"]'), steps.check.outcome)
        run: |
          echo "ccache-$(python3 tools/ci/cache_growth.py check /tmp/gufo-ccache "$RUNNER_TEMP/cache-growth/ccache.json")" >> "$GITHUB_OUTPUT"
          # Rust objects are only ever added. Past 1 GiB, keep the restored
          # entry; warm-caches.yml starts main's over again at that size.
          if (( $(du -sb /tmp/gufo-rust-cache | cut -f1) > 1073741824 )); then
            echo "rust-save=false" >> "$GITHUB_OUTPUT"
          else
            echo "rust-$(python3 tools/ci/cache_growth.py check /tmp/gufo-rust-cache "$RUNNER_TEMP/cache-growth/rust.json")" >> "$GITHUB_OUTPUT"
          fi

      # Only pull requests save here. On main every check comes from Cachix
      # and compiles nothing, and a newer empty entry would supersede the one
      # warm-caches.yml saves; that workflow owns main's compiler caches.
      - name: Save compiler cache
        if: always() && github.event_name == 'pull_request' && contains(fromJSON('["success", "failure", "cancelled"]'), steps.check.outcome) && steps.growth.outputs.ccache-save != 'false'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/gufo-ccache
          key: gufo-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}-${{ steps.ccache-key.outputs.epoch-week }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save Rust compiler cache
        if: always() && github.event_name == 'pull_request' && contains(fromJSON('["success", "failure", "cancelled"]'), steps.check.outcome) && steps.growth.outputs.rust-save != 'false'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/gufo-rust-cache
          key: gufo-rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}

  # Populate the shared production-package cache on main for later builds.
  cache-package:
    name: Warm Linux package cache
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/linux-build.yml
    with:
      revision: ${{ github.sha }}
      artifact-name: linux-${{ github.sha }}
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  # Keep only this ref's newest entry of each per-run cache so pull requests
  # do not push main's caches out of the 10 GB repository budget.
  prune-caches:
    name: Prune superseded caches
    needs: [ build-and-test, cache-package ]
    if: >-
      always() &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      actions: write
      contents: read
      pull-requests: read
    uses: ./.github/workflows/caches.yml
