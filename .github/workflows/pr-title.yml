name: PR title

on:
  pull_request:
    branches: [ main ]
    types: [ opened, edited, reopened, synchronize, labeled, unlabeled ]

permissions:
  contents: read

jobs:
  validate:
    name: Validate PR title and extension API
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 tools/ci/check-pr-title.py "$PR_TITLE"

      # The checkout is the merge of the pull request into main, so diff it
      # against that merge's main parent. The event's base SHA can be older
      # than the merged main, which would attribute main's later API changes
      # to the pull request.
      - name: Validate extension API diff and policy
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: python3 tools/ci/check-extension-api.py --base "$(git rev-parse HEAD^1)" --labels "$PR_LABELS"
