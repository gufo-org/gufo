name: Release Please

on:
  schedule:
    # Daily at a non-round minute to reduce scheduler congestion.
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release:
    name: Create daily release
    runs-on: ubuntu-latest
    # The release PR waits for the full Devlab functional run (about an hour).
    timeout-minutes: 180
    # App installation tokens expire after an hour, so the long wait for checks
    # uses the job token, which lasts as long as the job.
    permissions:
      contents: read
      checks: read
      statuses: read
      pull-requests: read
      issues: write
    steps:
      - name: Create release app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            gufo
            toolboxes
          permission-actions: read
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Maintain release pull request or publish merged release
        id: release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Request stable Toolboxes images for an existing merged release
        if: ${{ steps.release-please.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TAG: ${{ steps.release-please.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg tag "$RELEASE_TAG" \
            '{event_type: "gufo-release", client_payload: {tag: $tag}}' \
            | gh api --method POST repos/gufo-org/toolboxes/dispatches --input -

      - name: Check out the release pull request
        if: >-
          ${{ steps.release-please.outputs.prs_created == 'true' &&
              steps.release-please.outputs.release_created != 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_PRS: ${{ steps.release-please.outputs.prs }}
        shell: bash
        run: |
          set -euo pipefail
          pr_number="$(jq -er '.[0].number' <<<"$RELEASE_PRS")"
          gh pr checkout "$pr_number" --repo "$GITHUB_REPOSITORY"

      - name: Sync the Debian changelog with the release version
        if: >-
          ${{ steps.release-please.outputs.prs_created == 'true' &&
              steps.release-please.outputs.release_created != 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_PRS: ${{ steps.release-please.outputs.prs }}
        shell: bash
        run: |
          set -euo pipefail
          pr_number="$(jq -er '.[0].number' <<<"$RELEASE_PRS")"
          debian/gen-changelog.sh
          if git diff --quiet -- debian/changelog; then
            echo "debian/changelog is already current."
            exit 0
          fi
          git config user.name "gufo-release[bot]"
          git config user.email "gufo-release[bot]@users.noreply.github.com"
          git commit -m "build: sync the Debian changelog with the release version" \
            -- debian/changelog
          git push origin "HEAD:$(git rev-parse --abbrev-ref HEAD)"

      - name: Wait for release pull request checks
        if: >-
          ${{ steps.release-please.outputs.prs_created == 'true' &&
              steps.release-please.outputs.release_created != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PRS: ${{ steps.release-please.outputs.prs }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t pr_numbers < <(jq -er '.[].number' <<<"$RELEASE_PRS")
          if (( ${#pr_numbers[@]} == 0 )); then
            echo "Release Please reported a pull request without returning its number." >&2
            exit 1
          fi

          required_checks=(
            "Conventional Commit title"
            "CPU contracts & repository checks"
            # The full functional suite on Strix Halo; only releases require it.
            "devlab/functional"
          )
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          block() {
            # Leave the release PR open and tell the maintainers why.
            gh pr comment "$1" --repo "$GITHUB_REPOSITORY" --body "@fedeizzo @francescobozzo \
          The automatic release merge stopped: $2. Check the PR's checks and the \
          [release workflow run]($run_url), then merge by hand or close the PR."
            echo "$2" >&2
            exit 1
          }

          for pr_number in "${pr_numbers[@]}"; do
            # Ten-second polls for up to 160 minutes.
            for attempt in {1..960}; do
              checks_rc=0
              checks=$(gh pr checks "$pr_number" \
                --repo "$GITHUB_REPOSITORY" \
                --json name,bucket 2>/dev/null) || checks_rc=$?
              if (( checks_rc != 0 && checks_rc != 8 )); then
                checks='[]'
              fi
              all_passed=true

              for check_name in "${required_checks[@]}"; do
                bucket=$(jq -r --arg name "$check_name" '
                  if any(.[]; .name == $name and .bucket == "pass") then "pass"
                  elif any(.[]; .name == $name and
                    (.bucket == "fail" or .bucket == "cancel" or
                     .bucket == "skipping")) then "fail"
                  else "pending"
                  end
                ' <<<"$checks")

                if [[ "$bucket" == "fail" ]]; then
                  block "$pr_number" "required check \`${check_name}\` did not pass"
                fi
                if [[ "$bucket" != "pass" ]]; then
                  all_passed=false
                fi
              done

              if [[ "$all_passed" == true ]]; then
                break
              fi
              if (( attempt == 960 )); then
                block "$pr_number" "required checks were still pending after 160 minutes"
              fi
              sleep 10
            done
          done

      - name: Create fresh release app token after the wait
        if: >-
          ${{ steps.release-please.outputs.prs_created == 'true' &&
              steps.release-please.outputs.release_created != 'true' }}
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            gufo
            toolboxes
          permission-actions: read
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Merge release pull request
        if: >-
          ${{ steps.release-please.outputs.prs_created == 'true' &&
              steps.release-please.outputs.release_created != 'true' }}
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          RELEASE_PRS: ${{ steps.release-please.outputs.prs }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t pr_numbers < <(jq -er '.[].number' <<<"$RELEASE_PRS")
          for pr_number in "${pr_numbers[@]}"; do
            pr_title=$(gh pr view "$pr_number" \
              --repo "$GITHUB_REPOSITORY" \
              --json title \
              --jq .title)
            gh pr merge "$pr_number" \
              --repo "$GITHUB_REPOSITORY" \
              --squash \
              --subject "$pr_title" \
              --body ""
          done

      - name: Publish automatically merged release
        if: >-
          ${{ steps.release-please.outputs.prs_created == 'true' &&
              steps.release-please.outputs.release_created != 'true' }}
        id: publish-release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.release-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Request stable Toolboxes images for the daily release
        if: ${{ steps.publish-release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          RELEASE_TAG: ${{ steps.publish-release.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg tag "$RELEASE_TAG" \
            '{event_type: "gufo-release", client_payload: {tag: $tag}}' \
            | gh api --method POST repos/gufo-org/toolboxes/dispatches --input -
