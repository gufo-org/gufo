name: Release Please

on:
  schedule:
    # Daily at a non-round minute to reduce scheduler congestion.
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Maintain release pull request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create release app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            gufo
            toolboxes
          permission-actions: read
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Maintain release pull request or publish merged release
        id: release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Request stable Toolboxes images
        if: ${{ steps.release-please.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TAG: ${{ steps.release-please.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg tag "$RELEASE_TAG" \
            '{event_type: "gufo-release", client_payload: {tag: $tag}}' \
            | gh api --method POST repos/gufo-org/toolboxes/dispatches --input -
