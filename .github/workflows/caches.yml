name: Actions caches

# Keeps the repository's 10 GB Actions cache for main's warm caches. GitHub
# evicts the least recently used entries once the budget is full, and a pull
# request can restore only its own entries and main's.
#
# - A closed pull request's entries are deleted: nothing can restore them.
# - A caller prunes its own ref after saving: per-run keys end in
#   -<run id>-<attempt>, and only the newest entry of each family survives.
#   Callers grant this job's permissions: actions: write, pull-requests: read.
# - The nightly run does both for every ref, catching missed events.
#
# No job checks out code, so pull_request_target runs nothing from the PR.

on:
  pull_request_target:
    types: [ closed ]
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
  workflow_call:

permissions: {}

jobs:
  prune:
    name: Prune caches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      EVENT: ${{ github.event_name }}
      CLOSED_PR: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.number || '' }}
      CALLER_REF: ${{ github.ref }}
    steps:
      - name: Prune Actions caches
        shell: bash
        run: |
          set -euo pipefail

          # Lists "id<TAB>ref<TAB>key" for one ref, or for every ref.
          list() {
            local args=(-X GET "repos/$GH_REPO/actions/caches" -F per_page=100)
            if [[ -n "${1:-}" ]]; then args+=(-f ref="$1"); fi
            gh api --paginate "${args[@]}" --jq '.actions_caches[] | [.id, .ref, .key] | @tsv'
          }

          remove() {
            local id ref key
            while IFS=$'\t' read -r id ref key; do
              [[ -n "$id" ]] || continue
              # A concurrent prune may have removed it already.
              if gh api --silent -X DELETE "repos/$GH_REPO/actions/caches/$id" 2>/dev/null; then
                echo "deleted $ref $key"
              fi
            done
          }

          # Every entry of a per-run family except the newest run's, per ref.
          superseded() {
            awk -F '\t' '
              match($3, /-[0-9]+-[0-9]+$/) {
                tail = substr($3, RSTART + 1); split(tail, n, "-")
                if (length(n[1]) < 8) next
                family = $2 "\t" substr($3, 1, RSTART - 1)
                run = n[1] * 1000 + n[2]
                rows[NR] = $0; fam[NR] = family; order[NR] = run
                if (!(family in best) || run > best[family]) best[family] = run
              }
              END { for (i in rows) if (order[i] < best[fam[i]]) print rows[i] }'
          }

          case "$EVENT" in
            pull_request_target)
              for ref in "refs/pull/$CLOSED_PR/merge" "refs/pull/$CLOSED_PR/head"; do
                list "$ref" | remove
              done
              ;;
            schedule|workflow_dispatch)
              all=$(list)
              closed=$(printf '%s\n' "$all" | cut -f2 | sort -u | sed -n 's|^refs/pull/\([0-9]*\)/.*|\1|p' | sort -u |
                while read -r pr; do
                  state=$(gh api "repos/$GH_REPO/pulls/$pr" --jq .state 2>/dev/null || echo unknown)
                  if [[ "$state" == closed ]]; then printf '%s ' "$pr"; fi
                done)
              printf '%s\n' "$all" | awk -F '\t' -v closed="$closed" '
                BEGIN { n = split(closed, c, " "); for (i = 1; i <= n; i++) if (c[i] != "") gone["refs/pull/" c[i] "/merge"] = gone["refs/pull/" c[i] "/head"] = 1 }
                ($2 in gone)' | remove
              printf '%s\n' "$all" | superseded | remove
              ;;
            *)
              list "$CALLER_REF" | superseded | remove
              ;;
          esac
