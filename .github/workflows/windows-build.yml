name: Windows build

# Reusable native build for Windows validation and Toolboxes release packaging.
# Keep caches here so both callers share the SDK, compiler and vcpkg archives.

on:
  workflow_call:
    inputs:
      release-tag:
        description: Exact Gufo release tag to build for Toolboxes
        required: false
        default: ''
        type: string
    outputs:
      bundle-id:
        description: Windows bundle artifact for model validation
        value: ${{ jobs.build.outputs.bundle-id }}
      artifact-name:
        description: Artifact containing the Windows release ZIP and checksum
        value: ${{ jobs.build.outputs.release-artifact-name }}

permissions:
  contents: read

concurrency:
  group: windows-${{ inputs.release-tag || github.ref }}
  cancel-in-progress: ${{ !inputs.release-tag }}

jobs:
  build:
    name: Windows package
    runs-on: windows-latest
    timeout-minutes: 120
    outputs:
      bundle-id: ${{ steps.bundle.outputs.artifact-id }}
      bundle-digest: ${{ steps.bundle.outputs.artifact-digest }}
      release-artifact-name: ${{ steps.release-package.outputs.artifact-name }}
    defaults:
      run:
        shell: pwsh
    env:
      # TheRock 10.0.0, the SDK validated at full speed on gfx1151. AMD's
      # index no longer serves it: the job restores it from the Actions cache
      # and downloads the Windows port's mirror only on a miss.
      SDK_TARBALL: therock-dist-windows-gfx1151-10.0.0.tar.gz
      SDK_URL: https://github.com/endyjasmi/gufo/releases/download/toolchain/therock-10.0.0/therock-dist-windows-gfx1151-10.0.0.tar.gz
      SDK_SHA256: 1293927b06b3b8d4bd7e0265823fb998bc9e0d83c68f33dcfa5d32663b30ce38
      # Forward slashes: CMake reads backslashes in -D values as escapes.
      SDK_ROOT: C:/TheRock/build
      GUFO_PACKAGING_ROOT: ${{ github.workspace }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A reusable workflow otherwise checks out its caller (Toolboxes).
          repository: ${{ inputs.release-tag && 'gufo-org/gufo' || github.repository }}
          ref: ${{ inputs.release-tag && format('refs/tags/{0}', inputs.release-tag) || github.ref }}

      # The executable stays at the release tag. Packaging tools may be newer
      # (for example, repairing a missing runtime in an already released ZIP).
      - name: Check out release packaging tools
        if: inputs.release-tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gufo-org/gufo
          ref: main
          path: build/gufo-packaging
          sparse-checkout: |
            tools/windows
            tests/tools
            licenses
          persist-credentials: false

      - name: Select release packaging tools
        if: inputs.release-tag
        run: '"GUFO_PACKAGING_ROOT=$env:GITHUB_WORKSPACE/build/gufo-packaging" >> $env:GITHUB_ENV'

      - name: Identify release source
        if: inputs.release-tag
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          if ($env:RELEASE_TAG -cnotmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw "invalid release tag: $env:RELEASE_TAG"
          }
          $version = (Get-Content version.txt -Raw).Trim()
          if ("v$version" -cne $env:RELEASE_TAG) { throw 'tag and version.txt disagree' }
          $revision = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'cannot identify release revision' }
          "GUFO_RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          "GUFO_REVISION=$revision" >> $env:GITHUB_ENV

      - name: Restore TheRock SDK archive
        id: therock-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\therock-archive
          key: gufo-therock-v2-${{ env.SDK_TARBALL }}

      - name: Install the TheRock SDK
        id: sdk
        run: |
          $archive = "$env:RUNNER_TEMP\therock-archive\$env:SDK_TARBALL"
          New-Item -ItemType Directory -Force -Path (Split-Path $archive), $env:SDK_ROOT | Out-Null
          if (-not (Test-Path $archive)) {
            curl.exe --fail --location --retry 3 --no-progress-meter --output "$archive.part" $env:SDK_URL
            if ($LASTEXITCODE -ne 0) { throw "cannot download $env:SDK_TARBALL" }
            Move-Item "$archive.part" $archive
          }
          $sha = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($sha -ne $env:SDK_SHA256) { throw "$env:SDK_TARBALL has sha256 $sha, expected $env:SDK_SHA256" }
          "archive=ready" >> $env:GITHUB_OUTPUT
          tar -xzf $archive -C $env:SDK_ROOT
          if ($LASTEXITCODE -ne 0) { throw "cannot unpack $env:SDK_TARBALL" }
          # CMake cannot find HIP by itself in TheRock's layout.
          "HIP_PATH=$env:SDK_ROOT" >> $env:GITHUB_ENV
          ($env:SDK_ROOT -replace '/', '\') + '\bin' >> $env:GITHUB_PATH

      # MSVC 14.40+ clashes with clang's HIP math headers; idempotent.
      - name: Patch the HIP SDK math headers
        run: python tools/windows/patch_sdk_math.py $env:SDK_ROOT

      # vcvars64 once, exported to later steps, instead of a wrapper per command.
      - name: Set up the MSVC x64 environment
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'no Visual Studio installation with the x64 VC toolset was found' }
          $bat = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $before = @{}
          foreach ($line in (cmd /s /c 'set')) {
            if ($line -match '^([^=]+)=(.*)$') { $before[$Matches[1]] = $Matches[2] }
          }
          foreach ($line in (cmd /s /c "call `"$bat`" >NUL 2>&1 && set")) {
            if ($line -notmatch '^([^=]+)=(.*)$') { continue }
            if ($before.ContainsKey($Matches[1]) -and $before[$Matches[1]] -eq $Matches[2]) { continue }
            "$($Matches[1])=$($Matches[2])" >> $env:GITHUB_ENV
          }

      - name: Install Ninja and ccache
        run: |
          choco install ninja ccache -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'cannot install ninja and ccache' }

      # CMakeLists.txt compiles C, CXX and (with clang-cl) HIP through ccache
      # when it is on PATH. The SDK is unpacked fresh each run, so the
      # compiler is identified by its pinned tarball rather than by mtime.
      - name: Restore compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\ccache
          key: gufo-windows-ccache-v1-${{ env.SDK_TARBALL }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            gufo-windows-ccache-v1-${{ env.SDK_TARBALL }}-

      - name: Prepare compiler cache
        run: |
          "CCACHE_DIR=$env:RUNNER_TEMP\ccache" >> $env:GITHUB_ENV
          "CCACHE_BASEDIR=$env:GITHUB_WORKSPACE" >> $env:GITHUB_ENV
          "CCACHE_COMPILERCHECK=string:$env:SDK_TARBALL" >> $env:GITHUB_ENV
          "CCACHE_MAXSIZE=2G" >> $env:GITHUB_ENV
          # GITHUB_ENV applies from the next step on.
          ccache --dir "$env:RUNNER_TEMP\ccache" --zero-stats

      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\vcpkg-archives
          key: gufo-vcpkg-v4-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            gufo-vcpkg-v4-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}-
            gufo-vcpkg-v4-${{ runner.os }}-

      # A full clone: the manifest baseline resolves through vcpkg's history.
      # vcvars points VCPKG_ROOT at the VS-bundled copy, which is not one.
      - name: Prepare vcpkg
        run: |
          git clone --quiet https://github.com/microsoft/vcpkg.git C:\vcpkg-gufo
          if ($LASTEXITCODE -ne 0) { throw 'cannot clone vcpkg' }
          & C:\vcpkg-gufo\bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw 'cannot bootstrap vcpkg' }
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\vcpkg-archives" | Out-Null
          "VCPKG_ROOT=C:\vcpkg-gufo" >> $env:GITHUB_ENV
          "VCPKG_DEFAULT_BINARY_CACHE=$env:RUNNER_TEMP\vcpkg-archives" >> $env:GITHUB_ENV

      # Visual Studio's LLVM OpenMP DLL is under debug_nonredist and cannot
      # be shipped. Build the upstream runtime with the ABI filename imported
      # by TheRock (including rocalution), rather than renaming another DLL.
      - name: Check out LLVM OpenMP
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llvm/llvm-project
          ref: 3b5b5c1ec4a3095ab096dd780e84d7ab81f3d7ff # llvmorg-18.1.8
          path: build/llvm-project
          sparse-checkout: |
            cmake
            llvm/cmake
            openmp
          persist-credentials: false

      - name: Build redistributable LLVM OpenMP
        id: openmp
        run: |
          $clang = Get-ChildItem "$env:SDK_ROOT/lib/llvm/bin" -Filter '*clang-cl.exe' | Select-Object -First 1
          if (-not $clang) { throw 'SDK clang-cl not found' }
          cmake -S build/llvm-project/openmp -B build/openmp -G Ninja `
            "-DCMAKE_C_COMPILER=$($clang.FullName)" "-DCMAKE_CXX_COMPILER=$($clang.FullName)" `
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache `
            -DCMAKE_BUILD_TYPE=Release -DOPENMP_MSVC_NAME_SCHEME=ON `
            -DOPENMP_ENABLE_LIBOMPTARGET=OFF -DLIBOMP_OMPT_SUPPORT=OFF
          if ($LASTEXITCODE -ne 0) { throw 'OpenMP configure failed' }
          cmake --build build/openmp --parallel $env:NUMBER_OF_PROCESSORS --target omp ompimp
          if ($LASTEXITCODE -ne 0) { throw 'OpenMP build failed' }
          $runtime = 'build/openmp/runtime/src/libomp140.x86_64.dll'
          if (-not (Test-Path $runtime)) { throw "OpenMP runtime missing: $runtime" }
          New-Item -ItemType Directory -Force build/windows-release | Out-Null
          Copy-Item $runtime build/windows-release

      - name: Configure Windows build
        id: configure
        run: |
          $identity = @("-DGUFO_EXTENSIONS_FROM_LOCK=OFF")
          if ($env:GUFO_RELEASE_VERSION) {
            $identity = @("-DGUFO_RELEASE_VERSION=$env:GUFO_RELEASE_VERSION", "-DGUFO_REVISION=$env:GUFO_REVISION", "-DGUFO_EXTENSIONS_FROM_LOCK=ON")
          }
          # ccache cannot cache objects that write a shared /Zi PDB: embed
          # the debug info in each object instead (/Z7).
          cmake --preset windows-release -DBUILD_TESTING=ON "-DCMAKE_HIP_COMPILER_ROCM_ROOT=$env:SDK_ROOT" `
            -DCMAKE_POLICY_DEFAULT_CMP0141=NEW -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded `
            -DOpenMP_CXX_LIB_NAMES=libomp "-DOpenMP_libomp_LIBRARY=$PWD/build/openmp/runtime/src/libomp.lib" `
            "-DOpenMP_CXX_INCLUDE_DIR=$PWD/build/openmp/runtime/src" @identity
          if ($LASTEXITCODE -ne 0) { throw 'configure failed' }
          "$PWD\build\windows-release\vcpkg_installed\x64-windows-release\bin" >> $env:GITHUB_PATH
          "$PWD\build\windows-release" >> $env:GITHUB_PATH

      - name: Build application and test binaries
        run: |
          cmake --build --preset windows-release --parallel $env:NUMBER_OF_PROCESSORS --target gufo gufo-server component_text_cache_test qwen38_flash_next_ngram_test gpu_queues_test bandwidth_test allocation_benchmark_test
          if ($LASTEXITCODE -ne 0) { throw 'build failed' }
          ccache --show-stats

      - name: Run CPU and application checks
        run: |
          $gufo = 'build\windows-release\gufo.exe'
          if (-not (Test-Path $gufo)) { throw "$gufo was not built" }
          & $gufo --version
          if ($LASTEXITCODE -ne 0) { throw 'gufo --version failed' }
          # The hosted runner has no GPU: only the platform section can pass
          # here; the Devlab job runs the full diagnosis on the device.
          & $gufo diagnose --section platform
          if ($LASTEXITCODE -ne 0) { throw 'gufo diagnose --section platform failed' }
          cmake --build --preset windows-release --parallel $env:NUMBER_OF_PROCESSORS --target check-pr
          if ($LASTEXITCODE -ne 0) { throw 'check-pr failed' }
          ctest --test-dir build/windows-release --output-on-failure --no-tests=error --timeout 60 -R '^(qwen38_flash_next\.ngram|gpu_queues_test|bandwidth_test|allocation_benchmark_test)$'
          if ($LASTEXITCODE -ne 0) { throw 'diagnostics and ngram tests failed' }

      # Everything gufo.exe loads, so the Devlab runner downloads one artifact
      # and nothing else: the staged HIP runtime with its rocBLAS/hipBLASLt
      # kernel directories, the vcpkg DLLs, the MSVC CRT and LLVM OpenMP, plus
      # the weight-free GPU tests and the model smoke checks with their
      # references (Devlab checks out only the download tools).
      - name: Package GPU validation bundle
        run: |
          $dist = "$env:RUNNER_TEMP\windows-gufo"
          $build = 'build\windows-release'
          New-Item -ItemType Directory -Force -Path $dist, "$dist\tests\fixtures", "$dist\tests\functional\fixtures" | Out-Null
          Copy-Item "$build\gufo.exe", "$build\*.dll", "$env:SDK_ROOT\bin\hipInfo.exe" $dist
          foreach ($dir in 'rocblas', 'hipblaslt') {
            if (Test-Path "$build\$dir") { Copy-Item "$build\$dir" $dist -Recurse }
          }
          Copy-Item "$build\vcpkg_installed\x64-windows-release\bin\*.dll" $dist -Force
          if (Test-Path "$build\gufo-video-libraries.txt") {
            Copy-Item "$build\gufo-video-libraries.txt" $dist
            $videoTest = Get-ChildItem $build -Recurse -Filter 'embedding_gemma2_video_processor_test.exe' | Select-Object -First 1
            if (-not $videoTest) { throw 'video decoder CPU test was not built' }
            Copy-Item $videoTest.FullName $dist
          }
          Copy-Item "$env:GUFO_PACKAGING_ROOT/licenses/llvm-openmp.txt" "$dist/llvm-openmp-LICENSE.txt"
          'LLVM OpenMP 18.1.8, source: https://github.com/llvm/llvm-project/tree/3b5b5c1ec4a3095ab096dd780e84d7ab81f3d7ff/openmp; Apache-2.0 WITH LLVM-exception; built with OPENMP_MSVC_NAME_SCHEME=ON.' |
            Set-Content "$dist/llvm-openmp-version.txt" -Encoding ascii
          $redist = Get-ChildItem "$env:VCToolsRedistDir\x64" -Directory |
            Where-Object { $_.Name -like 'Microsoft.VC*.CRT' }
          foreach ($dir in $redist) { Copy-Item "$($dir.FullName)\*.dll" $dist -Force }
          foreach ($test in 'gpu_queues_test', 'bandwidth_test', 'allocation_benchmark_test') {
            $exe = Get-ChildItem $build -Recurse -Filter "$test.exe" | Select-Object -First 1
            if (-not $exe) { throw "$test.exe was not built" }
            Copy-Item $exe.FullName $dist
          }
          # bandwidth_test reads its schema fixture relative to the working directory.
          Copy-Item tests\fixtures\diagnostics, tests\fixtures\embedding_gemma2 "$dist\tests\fixtures" -Recurse
          Copy-Item tests\functional\family_smoke.py, tests\functional\devlab.json "$dist\tests\functional"
          Copy-Item tests\functional\fixtures\audio "$dist\tests\functional\fixtures" -Recurse
          $files = Get-ChildItem $dist -Recurse -File
          # The Devlab job checks the download against this list.
          $files | ForEach-Object { "{0}`t{1}" -f $_.Length, $_.FullName.Substring($dist.Length + 1) } |
            Set-Content "$dist\bundle-manifest.txt" -Encoding utf8
          "Bundle: {0} files, {1:N0} MiB" -f $files.Count, (($files | Measure-Object Length -Sum).Sum / 1MB) |
            Tee-Object -Append $env:GITHUB_STEP_SUMMARY

      # Inspect imports rather than trusting PATH: the hosted builder may
      # already have a dependency in System32. Run this on PR bundles too.
      - name: Validate GPU validation bundle
        run: |
          python -m pip install pefile==2024.8.26
          if ($LASTEXITCODE -ne 0) { throw 'cannot install PE inspection tool' }
          python -m unittest discover -s "$env:GUFO_PACKAGING_ROOT/tests/tools" -p windows_bundle_test.py
          if ($LASTEXITCODE -ne 0) { throw 'bundle checker tests failed' }
          $archive = "$env:RUNNER_TEMP/windows-bundle-test.zip"
          $extracted = "$env:RUNNER_TEMP/windows-bundle-test"
          tar -a -cf $archive -C "$env:RUNNER_TEMP/windows-gufo" .
          if ($LASTEXITCODE -ne 0) { throw 'cannot archive test bundle' }
          New-Item -ItemType Directory -Force $extracted | Out-Null
          tar -xf $archive -C $extracted
          if ($LASTEXITCODE -ne 0) { throw 'cannot extract test bundle' }
          python "$env:GUFO_PACKAGING_ROOT/tools/windows/check_bundle.py" $extracted
          if ($LASTEXITCODE -ne 0) { throw 'bundle has unshipped DLL dependencies' }
          $env:PATH = "$extracted;$env:SystemRoot/System32;$env:SystemRoot"
          Push-Location $extracted
          try {
            foreach ($argument in '--version', '--help') {
              $output = & ./gufo.exe $argument
              if ($LASTEXITCODE -ne 0 -or -not $output) { throw "bundled gufo $argument failed" }
            }
            if (Test-Path './embedding_gemma2_video_processor_test.exe') {
              & ./embedding_gemma2_video_processor_test.exe tests/fixtures/embedding_gemma2/video_golden.json
              if ($LASTEXITCODE -ne 0) { throw 'bundled video decoder checks failed' }
            }
            & ./gufo.exe diagnose --section platform
            if ($LASTEXITCODE -ne 0) { throw 'extracted bundle platform diagnosis failed' }
          } finally { Pop-Location }

      - name: Upload GPU validation bundle
        if: ${{ !inputs.release-tag }}
        id: bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-gufo-${{ github.run_attempt }}
          path: ${{ runner.temp }}\windows-gufo
          if-no-files-found: error
          retention-days: 3

      - name: Package Windows release
        if: inputs.release-tag
        id: release-package
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          $dist = "$env:RUNNER_TEMP\gufo-release"
          $bundle = "$env:RUNNER_TEMP\windows-gufo"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item "$bundle\gufo.exe", "$bundle\*.dll", LICENSE, NOTICE, THIRD_PARTY_NOTICES.md $dist
          Copy-Item "$bundle/llvm-openmp-LICENSE.txt", "$bundle/llvm-openmp-version.txt" $dist
          if (Test-Path "$bundle/gufo-video-libraries.txt") {
            Copy-Item "$bundle/gufo-video-libraries.txt" $dist
          }
          Copy-Item licenses "$dist\third-party" -Recurse
          Copy-Item src\models\deepseek_v4_flash\LICENSE.ds4 "$dist\third-party"
          foreach ($dir in 'rocblas', 'hipblaslt') {
            if (Test-Path "$bundle\$dir") { Copy-Item "$bundle\$dir" $dist -Recurse }
          }
          $archive = "$env:RUNNER_TEMP\gufo-$env:RELEASE_TAG-windows-x86_64.zip"
          # Windows' libarchive tar supports ZIP64 for the HIP runtime. Pack
          # the top-level items by name, not '.': Explorer's ZIP folder lists
          # nothing when entry names carry the resulting './' prefix.
          tar -a -cf $archive -C $dist @((Get-ChildItem $dist).Name)
          if ($LASTEXITCODE -ne 0) { throw 'cannot pack Windows release' }
          python -c "import sys, zipfile; sys.exit(any(n.startswith('./') for n in zipfile.ZipFile(sys.argv[1]).namelist()))" $archive
          if ($LASTEXITCODE -ne 0) { throw 'release ZIP names entries ./-prefixed, hiding them from Windows Explorer' }
          # Validate the exact release ZIP, not only its staging directory.
          $extracted = "$env:RUNNER_TEMP/gufo-release-verify"
          New-Item -ItemType Directory -Force $extracted | Out-Null
          tar -xf $archive -C $extracted
          if ($LASTEXITCODE -ne 0) { throw 'cannot extract Windows release' }
          python "$env:GUFO_PACKAGING_ROOT/tools/windows/check_bundle.py" $extracted
          if ($LASTEXITCODE -ne 0) { throw 'release ZIP has unshipped DLL dependencies' }
          # Use an external CPU harness beside the extracted release DLLs.
          # Tests and fixtures stay out of the published ZIP.
          if (Test-Path "$bundle/embedding_gemma2_video_processor_test.exe") {
            Copy-Item "$bundle/embedding_gemma2_video_processor_test.exe" $extracted
          }
          $env:PATH = "$extracted;$env:SystemRoot/System32;$env:SystemRoot"
          Push-Location $extracted
          try {
            $expected = "gufo version $env:GUFO_RELEASE_VERSION ($env:GUFO_REVISION)"
            $actual = & ./gufo.exe --version
            # Historical tags predate extension selection; repackaging them
            # still checks their immutable version/revision first line.
            $hasExtensionLock = Test-Path "$env:GITHUB_WORKSPACE/extensions.lock"
            if ($LASTEXITCODE -ne 0 -or @($actual)[0] -cne $expected -or ($hasExtensionLock -and -not ($actual -contains "Extension selection: lock"))) {
              throw "release reports '$actual', expected '$expected'"
            }
            $help = & ./gufo.exe --help
            if ($LASTEXITCODE -ne 0 -or -not $help) { throw 'release help failed' }
            if (Test-Path './embedding_gemma2_video_processor_test.exe') {
              & ./embedding_gemma2_video_processor_test.exe "$bundle/tests/fixtures/embedding_gemma2/video_golden.json"
              if ($LASTEXITCODE -ne 0) { throw 'bundled video decoder checks failed' }
            }
            & ./gufo.exe diagnose --section platform
            if ($LASTEXITCODE -ne 0) { throw 'release platform diagnosis failed' }
          } finally { Pop-Location }
          $sha = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$sha  $(Split-Path $archive -Leaf)" | Set-Content "$archive.sha256" -Encoding ascii
          "artifact-name=windows-release-$env:RELEASE_TAG-$env:GITHUB_RUN_ATTEMPT" >> $env:GITHUB_OUTPUT
          "archive=$archive" >> $env:GITHUB_OUTPUT

      - name: Upload Windows release
        if: inputs.release-tag
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.release-package.outputs.artifact-name }}
          path: |
            ${{ steps.release-package.outputs.archive }}
            ${{ steps.release-package.outputs.archive }}.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-build-logs-${{ github.run_attempt }}
          path: |
            build/windows-release/CMakeFiles/CMakeConfigureLog.yaml
            build/windows-release/vcpkg-manifest-install.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Save TheRock SDK archive
        if: always() && steps.therock-cache.outputs.cache-hit != 'true' && steps.sdk.outputs.archive == 'ready'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\therock-archive
          key: gufo-therock-v2-${{ env.SDK_TARBALL }}

      # Save both OpenMP and Gufo objects, even if a later stage fails. A fresh
      # key preserves this run's new entries alongside the restored set.
      - name: Save compiler cache
        if: always() && (steps.openmp.outcome == 'success' || steps.configure.outcome == 'success')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\ccache
          key: gufo-windows-ccache-v1-${{ env.SDK_TARBALL }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save vcpkg binary cache
        if: always() && steps.configure.outcome != 'skipped'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\vcpkg-archives
          key: gufo-vcpkg-v4-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
