[package]
name = "gufo-http-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
bytes = { version = "=1.10.1", default-features = false, features = ["std"] }
gufo-ffi = { path = "../ffi" }
gufo-websocket = { path = "../websocket" }
http = { version = "=1.3.1", default-features = false, features = ["std"] }
http-body-util = { version = "=0.1.3", default-features = false }
hyper = { version = "=1.6.0", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "=0.1.14", default-features = false, features = ["tokio"] }
socket2 = { version = "=0.5.10", default-features = false }
tokio = { version = "=1.45.1", default-features = false, features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros"] }
