[package]
name = "gufo-png-decode"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT"

[lib]
crate-type = ["staticlib"]

[profile.release]
debug = 1

# Match the assertion-enabled CMake RelWithDebInfo development/test builds.
[profile.relwithdebinfo]
inherits = "release"
debug = 2
debug-assertions = true
overflow-checks = true

[dependencies]
png = "=0.18.1"
